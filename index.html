<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ART × PLACEMAKING — JAPAN MAP</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:       #181818;
      --bg2:      #1f1f1f;
      --bg3:      #262626;
      --line:     #2e2e2e;
      --line2:    #3a3a3a;
      --text:     #f0f0f0;
      --muted:    #666;
      --dim:      #444;
      --accent:   #e8c96e;

      --c-tohoku: #d4826a;
      --c-kanto:  #e8c96e;
      --c-chubu:  #8ecf6e;
      --c-kansai: #6ecac8;
      --c-chushi: #a06ec8;
      --c-kyushu: #d46aa0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: stretch;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      z-index: 1000;
      flex-shrink: 0;
      height: 52px;
    }

    .hd-back {
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-right: 1px solid var(--line);
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .hd-back:hover { color: var(--text); background: var(--bg2); }
    .hd-back::before { content: '←'; margin-right: 8px; font-size: 13px; }

    .hd-brand {
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-right: 1px solid var(--line);
      gap: 12px;
    }

    .hd-brand-num {
      font-family: 'Archivo Black', sans-serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--accent);
      opacity: 0.6;
    }

    .hd-brand h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      white-space: nowrap;
    }

    .hd-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hd-spacer { flex: 1; }

    .hd-count {
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-left: 1px solid var(--line);
      gap: 8px;
    }

    .hd-count-num {
      font-family: 'Archivo Black', sans-serif;
      font-size: 22px;
      color: var(--accent);
      line-height: 1;
    }

    .hd-count-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── LAYOUT ──────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    .sidebar {
      width: 280px;
      background: var(--bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ── MOBILE ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* Map fixed at top, sidebar scrolls below */
      body { overflow: hidden; }

      .layout {
        flex-direction: column;
        overflow: hidden;
        height: 100%;
      }

      .map-wrapper {
        order: -1;
        height: 42vh;
        min-height: 240px;
        flex: none;
        position: relative;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-top: 1px solid var(--line);
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .festival-list {
        max-height: none;
        overflow-y: visible;
      }

      .legend {
        bottom: 10px;
        right: 8px;
        padding: 6px 10px;
      }
      .legend-body { padding: 6px 10px; }
      .legend-label { font-size: 9px; }

      .chips { gap: 4px; }
      .chip { font-size: 9px; padding: 3px 8px; }

      header { padding: 10px 14px; height: auto; flex-wrap: wrap; gap: 8px; }
      .hd-brand h1 { font-size: 12px; }
      .hd-sub { font-size: 8px; }
    }

    /* Filter blocks */
    .filter-block {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .fl-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 4px; }

    .chip {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid var(--line2);
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--muted); color: var(--text); }
    .chip.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }
    .chip[data-region="北海道・東北"].active,
    .chip[data-region="北海道・東北"]:hover { border-color: var(--c-tohoku); }
    .chip[data-region="北海道・東北"].active { background: var(--c-tohoku); color: var(--bg); border-color: var(--c-tohoku); }

    .chip[data-region="関東"].active { background: var(--c-kanto); color: var(--bg); border-color: var(--c-kanto); }
    .chip[data-region="中部"].active { background: var(--c-chubu); color: var(--bg); border-color: var(--c-chubu); }
    .chip[data-region="関西"].active { background: var(--c-kansai); color: var(--bg); border-color: var(--c-kansai); }
    .chip[data-region="中国・四国"].active { background: var(--c-chushi); color: var(--bg); border-color: var(--c-chushi); }
    .chip[data-region="九州・沖縄"].active { background: var(--c-kyushu); color: var(--bg); border-color: var(--c-kyushu); }

    .chip[data-impact="経済"].active { background: var(--c-kanto); color: var(--bg); border-color: var(--c-kanto); }
    .chip[data-impact="社会"].active { background: var(--c-kansai); color: var(--bg); border-color: var(--c-kansai); }
    .chip[data-impact="文化"].active { background: var(--c-chushi); color: var(--bg); border-color: var(--c-chushi); }

    /* Search */
    .search-block {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }

    .search-block input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--line2);
      padding: 8px 12px;
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-block input:focus { border-color: var(--dim); }
    .search-block input::placeholder {
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 10px;
    }

    /* List */
    .festival-list { flex: 1; overflow-y: auto; }
    .festival-list::-webkit-scrollbar { width: 2px; }
    .festival-list::-webkit-scrollbar-thumb { background: var(--line2); }

    .list-region-header {
      padding: 8px 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .list-region-header .rh-num {
      font-family: 'Archivo Black', sans-serif;
      font-size: 9px;
      color: var(--line2);
      letter-spacing: 0.05em;
    }

    .festival-item {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      transition: background 0.1s;
    }
    .festival-item:hover { background: var(--bg2); }
    .festival-item.active { background: var(--bg3); border-left: 2px solid var(--accent); padding-left: 14px; }

    .item-dot {
      width: 6px; height: 6px;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .item-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1.3;
      margin-bottom: 2px;
      color: var(--text);
    }
    .item-pref {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .item-tagline {
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      font-weight: 300;
      color: var(--dim);
      line-height: 1.4;
      margin-top: 2px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── MAP ─────────────────────────────────────────────── */
    .map-wrapper { position: relative; flex: 1; min-height: 0; }
    #map { width: 100%; height: 100%; }

    .leaflet-container { background: #1e1e1e !important; }
    .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(0.75) contrast(1.1) saturate(0.15);
    }
    .leaflet-marker-pane,
    .leaflet-popup-pane,
    .leaflet-overlay-pane,
    .leaflet-shadow-pane { filter: none !important; }

    .leaflet-control-zoom {
      border: 1px solid var(--line) !important;
      border-radius: 0 !important;
    }
    .leaflet-control-zoom a {
      background: var(--bg) !important;
      color: var(--text) !important;
      border-bottom: 1px solid var(--line) !important;
      border-radius: 0 !important;
      font-family: 'Archivo Black', sans-serif !important;
      font-size: 14px !important;
      line-height: 26px !important;
      width: 26px !important;
      height: 26px !important;
    }
    .leaflet-control-zoom a:hover { background: var(--bg2) !important; color: var(--accent) !important; }
    .leaflet-control-attribution {
      background: rgba(20,20,20,0.85) !important;
      color: #555 !important;
      font-size: 9px !important;
      font-family: 'Barlow Condensed', sans-serif !important;
    }
    .leaflet-control-attribution a { color: #555 !important; }

    /* Popup override */
    .leaflet-popup-content-wrapper {
      background: var(--bg) !important;
      border: 1px solid var(--line2) !important;
      border-radius: 0 !important;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5) !important;
      padding: 0 !important;
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-content { margin: 0 !important; width: 260px !important; }
    .leaflet-popup-close-button {
      color: var(--muted) !important;
      font-size: 18px !important;
      top: 10px !important;
      right: 10px !important;
      font-family: 'Archivo Black', sans-serif !important;
    }
    .leaflet-popup-close-button:hover { color: var(--text) !important; }

    .popup-inner { padding: 18px 18px 16px; }

    .popup-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .popup-region {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .popup-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 4px;
    }

    .popup-tagline {
      font-family: 'Barlow', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: var(--dim);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-bottom: 12px;
    }

    .popup-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border: 1px solid currentColor;
    }

    .popup-divider {
      height: 1px;
      background: var(--line);
      margin-bottom: 10px;
    }

    .popup-desc {
      font-family: 'Barlow', sans-serif;
      font-size: 11px;
      font-weight: 300;
      line-height: 1.7;
      color: var(--dim);
      margin-bottom: 14px;
    }

    .popup-btn-row { display: flex; gap: 6px; }

    .popup-link, .popup-link-url {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 8px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      text-align: center;
    }
    .popup-link { color: var(--bg); background: var(--text); }
    .popup-link:hover { background: var(--accent); color: var(--bg); }
    .popup-link-url { color: var(--accent); background: transparent; border: 1px solid var(--accent); }
    .popup-link-url:hover { background: var(--accent); color: var(--bg); }

    /* ── LEGEND ──────────────────────────────────────────── */
    /* Legend: horizontal bar at bottom of map */
    .legend {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 800;
      background: rgba(18,18,18,0.82);
      border-top: 1px solid rgba(58,58,58,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      padding: 6px 12px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .legend-head {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .legend-body {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      flex: 1;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-sq {
      width: 7px; height: 7px;
      flex-shrink: 0;
    }

    .legend-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(240,240,240,0.7);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <a class="hd-back" href="https://bawb199765-bot.github.io/Art_PlaceMaking/database/index.html">Database</a>
  <div class="hd-brand">
    <div>
      <div class="hd-brand-num">001</div>
      <h1>Art × Placemaking</h1>
      <div class="hd-sub">Japan — 47 Prefectures</div>
    </div>
  </div>

</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="filter-block">
      <div class="fl-label">取り組みカテゴリー</div>
      <div class="chips" id="cat-filters">
        <button class="chip active" data-cat="all">ALL</button>
        <button class="chip" data-cat="都市型芸術祭型">都市型芸術祭型</button>
        <button class="chip" data-cat="地域型芸術祭型">地域型芸術祭型</button>
        <button class="chip" data-cat="小規模プロジェクト型">小規模プロジェクト型</button>
        <button class="chip" data-cat="エリアマネジメント型">エリアマネジメント型</button>
        <button class="chip" data-cat="AIR・制作拠点型">AIR・制作拠点型</button>
        <button class="chip" data-cat="ミュージアム・拠点型">ミュージアム・拠点型</button>
        <button class="chip" data-cat="産業・工芸連携型">産業・工芸連携型</button>
      </div>
    </div>

    <div class="filter-block">
      <div class="fl-label">次回開催年</div>
      <div class="chips" id="year-filters">
        <button class="chip active" data-year="all">ALL</button>
        <button class="chip" data-year="通年">通年</button>
        <button class="chip" data-year="2026">2026</button>
        <button class="chip" data-year="2027">2027</button>
        <button class="chip" data-year="2028">2028</button>
      </div>
    </div>

    <div class="filter-block">
      <div class="fl-label">東京からの所要時間</div>
      <div class="chips" id="access-filters">
        <button class="chip active" data-access="all">ALL</button>
        <button class="chip" data-access="1">〜1時間</button>
        <button class="chip" data-access="2">〜2時間</button>
        <button class="chip" data-access="3">〜3時間</button>
        <button class="chip" data-access="4">〜4時間</button>
        <button class="chip" data-access="99">それ以上</button>
      </div>
    </div>

    <div class="search-block">
      <input type="text" id="search-input" placeholder="Search cases…" />
    </div>

    <div class="festival-list" id="festival-list"></div>

  </aside>

  <!-- MAP -->
  <div class="map-wrapper">
    <div id="map"></div>
    <div class="legend">
      <div class="legend-head">Category</div>
      <div class="legend-body">
        <div class="legend-item"><div class="legend-sq" style="background:#e8c96e"></div><span class="legend-label">都市型芸術祭型</span></div>
        <div class="legend-item"><div class="legend-sq" style="background:#8ecf6e"></div><span class="legend-label">地域型芸術祭型</span></div>
        <div class="legend-item"><div class="legend-sq" style="background:#f0a050"></div><span class="legend-label">小規模プロジェクト型</span></div>
        <div class="legend-item"><div class="legend-sq" style="background:#6ecac8"></div><span class="legend-label">エリアマネジメント型</span></div>
        <div class="legend-item"><div class="legend-sq" style="background:#a06ec8"></div><span class="legend-label">AIR・制作拠点型</span></div>
        <div class="legend-item"><div class="legend-sq" style="background:#d4826a"></div><span class="legend-label">ミュージアム・拠点型</span></div>
        <div class="legend-item"><div class="legend-sq" style="background:#d46aa0"></div><span class="legend-label">産業・工芸連携型</span></div>
      </div>
    </div>
  </div>

</div>

<script>
const CAT_COLORS = {
  "都市型芸術祭型":       "#e8c96e",
  "地域型芸術祭型":       "#8ecf6e",
  "小規模プロジェクト型": "#f0a050",
  "エリアマネジメント型": "#6ecac8",
  "AIR・制作拠点型":      "#a06ec8",
  "ミュージアム・拠点型": "#d4826a",
  "産業・工芸連携型":     "#d46aa0",
};

const IMPACT_COLORS = {
  "1-①": "#e8c96e", "1-②": "#e8c96e", "1-③": "#e8c96e",
  "2-①": "#6ecac8", "2-②": "#6ecac8", "2-③": "#6ecac8",
  "3-①": "#a06ec8", "3-②": "#a06ec8", "3-③": "#a06ec8",
};

function tagColor(tag) { return IMPACT_COLORS[tag.split(" ")[0]] || "#666"; }

const CASES = [
  { pref:"北海道", name:"札幌国際芸術祭（SIAF）", tagline:"都市型・メディアアートの拠点化", region:"北海道・東北", lat:43.06, lng:141.35, slug:"hokkaido", cat:"都市型芸術祭型", tags:[], desc:"札幌市の創造都市という思想と、豊かな自然と都市機能の調和、大学やIT産業が集まるメディアアーツ都市という特徴を生かした创造的な環境づくり。", url:"https://siaf.jp/", nextYear:"2027", tokyoHours:4 },

  { pref:"福岡", name:"Fukuoka Art Next", tagline:"文化政策としてのアート戦略", region:"九州・沖縄", lat:33.59, lng:130.4, slug:"fukuoka", cat:"小規模プロジェクト型", tags:[], desc:"福岡市が2022年度に始動した包括的な文化政策。産学官が連携し、市民がアートに触れる機会の創出とアーティストの成長・交流拠点の整備を同時に推進。Artist Cafe Fukuoka、ウォールアート掲出、アートフェアアジア福岡など多角的に展開する。", url:"https://fukuoka-art-next.jp/", nextYear:"通年", tokyoHours:3.5 },
  { pref:"佐賀", name:"Creative Residency in Arita", tagline:"産地×AIRで有田焼を更新", region:"九州・沖縄", lat:33.19, lng:129.88, slug:"saga", cat:"産業・工芸連携型", tags:[], desc:"磁器発祥の地・有田で国内外のアーティストやデザイナーが3ヶ月間滞在し、地元の窯元・職人とのコラボレーションを通じた創作活動を行う。オランダ王国大使館との連携を基盤に2016年から始まり、有田焼ブランドの国際的更新を推進。", url:"https://cri-arita.com/ja/", nextYear:"2026", tokyoHours:4 },
  { pref:"長崎", name:"南島原市アートビレッジ・シラキノ", tagline:"公共施設×AIRの実装", region:"九州・沖縄", lat:32.65, lng:130.31, slug:"nagasaki", cat:"ミュージアム・拠点型", tags:[], desc:"長崎県南島原市の廃校を若手芸術家の支援と地域文化の発展を目的とした芸術文化複合施設として改修。国内外のアーティストが一定期間滞在して制作を行い、地域住民との交流やワークショップを通じて地域に創造の拠点を築く。", url:"https://www.artvillage-shirakino.jp/", nextYear:"通年", tokyoHours:4.5 },
  { pref:"熊本", name:"くまもとアートポリス", tagline:"制度化されたデザイン行政", region:"九州・沖縄", lat:32.8, lng:130.71, slug:"kumamoto", cat:"小規模プロジェクト型", tags:[], desc:"熊本県が1988年から継続する公共建築・空間デザイン向上施策。著名建築家をコミッショナーに迎え、県内の公共施設・橋梁・道路・公園など幅広いインフラにデザインの質を実装し続けている。現在のコミッショナーは伊東豊雄。", url:"https://www.pref.kumamoto.jp/soshiki/115/85889.html", nextYear:"通年", tokyoHours:4 },

  { pref:"宮崎", name:"新富芸術祭", tagline:"小規模自治体の等身大芸術祭", region:"九州・沖縄", lat:32.07, lng:131.51, slug:"miyazaki", cat:"地域型芸術祭型", tags:[], desc:"新富町で開催される小規模自治体型の芸術祭。農村の田園風景・住民の日常・歴史的な祭祀空間をフィールドに、国内外のアーティストと地域住民が協働して作品を制作・展示。地域への負荷が小さく持続可能な設計が特徴。", url:"https://shintomi-art.jp/", nextYear:"不明", tokyoHours:5 },
  { pref:"鹿児島", name:"霧島アートの森活用まちづくり", tagline:"強い拠点を市域へ波及", region:"九州・沖縄", lat:31.92, lng:130.86, slug:"kagoshima", cat:"ミュージアム・拠点型", tags:[], desc:"湧水町にある県立野外美術館・霧島アートの森を核にしたまちづくり。霧島連山の火山地形と豊かな自然の中に国内外の彫刻・インスタレーション作品が点在し、鑑賞・教育・自然体験が一体となった場を形成する。", url:"https://open-air-museum.org/", nextYear:"通年", tokyoHours:5 },
  { pref:"沖縄", name:"やんばるアートフェスティバル", tagline:"自然共生・環境配慮型", region:"九州・沖縄", lat:26.72, lng:128.15, slug:"okinawa", cat:"地域型芸術祭型", tags:[], desc:"沖縄県北部・やんばる地域で開催される芸術祭。世界自然遺産に登録されたやんばるの亜熱帯の森・集落・海岸を会場に、自然との共生をテーマにした現代アートや伝統芸能・工芸を組み合わせたプログラムを展開する。", url:"https://yambaru-artfes.jp/", nextYear:"不明", tokyoHours:6 }
];

const IMPACT_PREFIX = { "経済": "1-", "社会": "2-", "文化": "3-" };
const REGION_ORDER = ["北海道・東北","関東","中部","関西","中国・四国","九州・沖縄"];
const REGION_NUM = { "北海道・東北":"01","関東":"02","中部":"03","関西":"04","中国・四国":"05","九州・沖縄":"06" };

let activeCat = "all", activeYear = "all", activeAccess = "all", searchQ = "";

function getFiltered() {
  return CASES.filter(c => {
    if (activeCat !== "all" && c.cat !== activeCat) return false;

    // Year filter — match if nextYear contains the selected year string
    if (activeYear !== "all") {
      if (activeYear === "通年") {
        if (c.nextYear !== "通年") return false;
      } else {
        if (!c.nextYear.includes(activeYear)) return false;
      }
    }

    // Access filter
    if (activeAccess !== "all") {
      const h = c.tokyoHours;
      const a = Number(activeAccess);
      if (a === 1 && h > 1) return false;
      if (a === 2 && (h <= 1 || h > 2)) return false;
      if (a === 3 && (h <= 2 || h > 3)) return false;
      if (a === 4 && (h <= 3 || h > 4)) return false;
      if (a === 99 && h <= 4) return false;
    }

    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!c.name.toLowerCase().includes(q) && !c.pref.includes(q) && !c.tagline.includes(q)) return false;
    }
    return true;
  });
}

// MAP
const map = L.map('map', { center: [36.2, 137.0], zoom: 6 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

let markers = [];

function markerIcon(c, active) {
  const color = CAT_COLORS[c.cat] || "#888";
  const s = active ? 20 : 15;
  const border = active ? `3px solid #fff` : `2px solid rgba(255,255,255,0.4)`;
  return L.divIcon({
    className: '',
    html: `<div style="width:${s}px;height:${s}px;background:${color};border:${border};box-shadow:0 3px 10px rgba(0,0,0,0.6);transition:all 0.15s;${active?'outline:2px solid '+color+';outline-offset:4px':''}"></div><div style="position:absolute;inset:-8px;cursor:pointer"></div>`,
    iconSize: [s, s],
    iconAnchor: [s/2, s/2],
    popupAnchor: [0, -(s/2+8)]
  });
}

function popupHtml(c) {
  const color = CAT_COLORS[c.cat] || "#888";
  const accessLabel = c.tokyoHours === 0 ? '東京駅' : `東京から約${c.tokyoHours}h`;
  const yearLabel = c.nextYear || '—';
  return `<div class="popup-inner">
    <div class="popup-head">
      <div class="popup-region" style="color:${color}">${c.cat} · ${c.pref}</div>
    </div>
    <div class="popup-name">${c.name}</div>
    <div class="popup-tagline">${c.tagline}</div>
    <div class="popup-meta" style="display:flex;gap:12px;margin-bottom:10px;">
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:0.15em;color:var(--muted);">次回 <span style="color:var(--text)">${yearLabel}</span></span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:0.15em;color:var(--muted);">${accessLabel}</span>
    </div>
    <div class="popup-divider"></div>
    <div class="popup-desc">${c.desc}</div>
    <div class="popup-btn-row">
      <a class="popup-link" href="https://bawb199765-bot.github.io/Art_PlaceMaking/detail-${c.slug}.html" target="_blank">DB Detail</a>
      ${c.url ? `<a class="popup-link-url" href="${c.url}" target="_blank">公式サイト ↗</a>` : ''}
    </div>
  </div>`;
}

function rebuild() {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];
  const filtered = getFiltered();

  filtered.forEach((c, i) => {
    const marker = L.marker([c.lat, c.lng], { icon: markerIcon(c, false) }).addTo(map);
    marker.bindPopup(popupHtml(c), { maxWidth: 280, closeButton: true });
    marker.on('click', () => { setActive(i); scrollListTo(i); });
    markers.push({ marker, case: c, idx: i });
  });
  renderList(filtered);
}

function setActive(idx) {
  markers.forEach((m, i) => m.marker.setIcon(markerIcon(m.case, i === idx)));
}

function scrollListTo(idx) {
  document.querySelectorAll('.festival-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.festival-item[data-idx="${idx}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

function renderList(filtered) {
  const list = document.getElementById('festival-list');
  if (!filtered.length) { list.innerHTML = '<div class="empty-state">No results</div>'; return; }
  const groups = {};
  REGION_ORDER.forEach(r => { groups[r] = []; });
  filtered.forEach((c, i) => { if (groups[c.region]) groups[c.region].push({ c, i }); });
  let html2 = '';
  REGION_ORDER.forEach(region => {
    if (!groups[region].length) return;
    const num = REGION_NUM[region] || '—';
    html2 += `<div class="list-region-header"><span class="rh-num">.${num}</span>${region}</div>`;
    groups[region].forEach(({ c, i }) => {
      const color = CAT_COLORS[c.cat] || "#888";
      html2 += `<div class="festival-item" data-idx="${i}" onclick="focusCase(${i})">
        <div class="item-dot" style="background:${color}"></div>
        <div>
          <div class="item-name">${c.name}</div>
          <div class="item-pref">${c.pref}</div>
          <div class="item-tagline">${c.tagline}</div>
        </div>
      </div>`;
    });
  });
  list.innerHTML = html2;
}

window.focusCase = function(idx) {
  const m = markers[idx];
  if (!m) return;
  map.setView([m.case.lat, m.case.lng], 10, { animate: true });
  setTimeout(() => m.marker.openPopup(), 350);
  setActive(idx);
  scrollListTo(idx);
};

document.querySelectorAll('#cat-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#cat-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    rebuild();
  });
});

document.querySelectorAll('#year-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#year-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeYear = btn.dataset.year;
    rebuild();
  });
});

document.querySelectorAll('#access-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#access-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeAccess = btn.dataset.access;
    rebuild();
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  searchQ = e.target.value;
  rebuild();
});

rebuild();
</script>
</body>
</html>
