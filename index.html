<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ART × PLACEMAKING — JAPAN MAP</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* paper / sumi / vermilion editorial palette */
      --bg:       #14110d;
      --bg2:      #1a1612;
      --bg3:      #221d17;
      --line:     #2a241c;
      --line2:    #3b3328;
      --text:     #f0e8d8;
      --muted:    #8a8174;
      --dim:      #5a5247;
      --accent:   #d96650;   /* 朱 vermilion */
      --accent-2: #e8c96e;   /* gold edge */

      /* category hues — single saturated set */
      --c-urban:    #d96650;
      --c-region:   #e8c96e;
      --c-micro:    #b8b06e;
      --c-area:     #7fb3a8;
      --c-air:      #b48cc6;
      --c-museum:   #d49a6e;
      --c-craft:    #c87a9a;

      --serif: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      --sans:  Helvetica, 'Helvetica Neue', Arial, sans-serif;
      --mono:  Helvetica, 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; background: #14110d; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* subtle paper-grain on dark surfaces */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255,240,210,0.012) 1px, transparent 1px);
      background-size: 3px 3px;
      mix-blend-mode: overlay;
      z-index: 9999;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: stretch;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      z-index: 1000;
      flex-shrink: 0;
      height: 50px;
    }

    .hd-back {
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-right: 1px solid var(--line);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.15s, background 0.15s, padding 0.15s;
      white-space: nowrap;
      gap: 10px;
    }
    .hd-back:hover { color: var(--text); background: var(--bg2); }
    .hd-back::before { content: '←'; font-size: 13px; transition: transform 0.15s; }
    .hd-back:hover::before { transform: translateX(-3px); }

    .hd-brand {
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-right: 1px solid var(--line);
      gap: 16px;
    }

    .hd-mark {
      width: 30px; height: 30px;
      background: var(--accent);
      color: #fff;
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 600;
      display: grid; place-items: center;
      letter-spacing: 0;
      flex-shrink: 0;
    }

    .hd-brand-text { display: flex; flex-direction: column; line-height: 1.1; }

    .hd-brand-num {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .hd-brand h1 {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      white-space: nowrap;
    }

    .hd-sub {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px;
    }

    .hd-spacer { flex: 1; }

    .hd-meta {
      display: flex;
      align-items: center;
      border-left: 1px solid var(--line);
    }

    .hd-meta-block {
      display: flex;
      flex-direction: column;
      padding: 0 22px;
      border-right: 1px solid var(--line);
      justify-content: center;
      height: 100%;
      min-width: 110px;
    }
    .hd-meta-block:last-child { border-right: none; }

    .hd-meta-k {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .hd-meta-v {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .hd-meta-v .accent { color: var(--accent); }
    .hd-meta-v .sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 4px; letter-spacing: 0.1em; }

    /* ── LAYOUT ──────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    .sidebar {
      width: 320px;
      background: var(--bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ── MOBILE ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      body { overflow: hidden; height: 100vh; height: 100svh; }
      .layout { flex-direction: column; overflow: hidden; height: 100%; }
      .map-wrapper { order: -1; height: 72vh; min-height: 380px; flex: none; position: relative; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-top: 1px solid var(--line);
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: block;
        transition: opacity 0.18s ease;
      }
      /* When a popup is open, hide the list area entirely so the map + popup own the screen */
      body.popup-open .sidebar {
        display: none;
      }
      body.popup-open .map-wrapper {
        height: 100%;
        flex: 1;
      }
      .festival-list { flex: none !important; overflow-y: visible !important; height: auto !important; max-height: none !important; }

      /* Compact filter blocks */
      .filter-block { padding: 9px 10px; }
      .fl-label {
        margin-bottom: 6px;
        padding-bottom: 4px;
        gap: 8px;
      }
      .fl-label-jp { font-size: 10.5px; letter-spacing: 0.04em; }
      .fl-label-en { font-size: 7px; letter-spacing: 0.18em; }

      /* All chips on one row, natural width with small gap */
      .chips {
        display: flex;
        flex-wrap: nowrap;
        gap: 3px;
        width: 100%;
        justify-content: flex-start;
      }
      .chip {
        font-size: 9.5px !important;
        padding: 4px 6px !important;
        letter-spacing: 0 !important;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .chip[data-cat]:not([data-cat="all"]),
      .chip[data-year]:not([data-year="all"]),
      .chip[data-access]:not([data-access="all"]) {
        font-size: 10px !important;
        letter-spacing: 0 !important;
      }

      /* Mobile abbreviations — `.filter-block` prefix bumps specificity above the
         desktop "non-ALL = serif" rule so font-size:0 actually takes effect */
      .filter-block .chip[data-cat="都市型芸術祭型"]       { font-size: 0 !important; }
      .filter-block .chip[data-cat="都市型芸術祭型"]::before { content: "都市型芸術祭"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="地域型芸術祭型"]       { font-size: 0 !important; }
      .filter-block .chip[data-cat="地域型芸術祭型"]::before { content: "地域型芸術祭"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="小規模プロジェクト型"] { font-size: 0 !important; }
      .filter-block .chip[data-cat="小規模プロジェクト型"]::before { content: "小規模"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="エリアマネジメント型"] { font-size: 0 !important; }
      .filter-block .chip[data-cat="エリアマネジメント型"]::before { content: "エリマネ"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="AIR・制作拠点型"]      { font-size: 0 !important; }
      .filter-block .chip[data-cat="AIR・制作拠点型"]::before { content: "AIR"; font-size: 10px; font-family: var(--mono); letter-spacing: 0.04em; }
      .filter-block .chip[data-cat="ミュージアム・拠点型"] { font-size: 0 !important; }
      .filter-block .chip[data-cat="ミュージアム・拠点型"]::before { content: "美術館"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="産業・工芸連携型"]     { font-size: 0 !important; }
      .filter-block .chip[data-cat="産業・工芸連携型"]::before { content: "工芸"; font-size: 10px; font-family: var(--serif); }

      header { height: auto; flex-wrap: wrap; }
      .hd-brand h1 { font-size: 13px; }
      .hd-sub { font-size: 8px; }
      .hd-meta-block { padding: 10px 14px; min-width: 0; }

      /* Map meta plate: shrink further to avoid covering coastline */
      .map-meta { top: 8px; right: 8px; padding: 5px 8px; font-size: 8px; }
      .map-meta-title { font-size: 8px; margin-bottom: 3px; }
      .map-meta-row { padding: 1px 0; gap: 10px; }

      /* Legend → single row, very compact, all 7 categories fit */
      .legend {
        padding: 4px 6px;
        gap: 4px;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }
      .legend-head {
        display: none; /* hide on mobile to save space */
      }
      .legend-body {
        flex-wrap: nowrap;
        gap: 4px;
        width: 100%;
        justify-content: space-between;
      }
      .legend-item { flex-shrink: 1; gap: 2px; min-width: 0; }
      .legend-sq { width: 5px; height: 5px; }
      .legend-label { font-size: 8.5px; letter-spacing: 0; white-space: nowrap; }
      .legend-label .en { display: none; }

      /* Shorten longest legend labels on mobile to fit one row */
      .legend-item .legend-label { font-size: 0; }
      .legend-item:nth-child(1) .legend-label::before { content: "都市型"; }
      .legend-item:nth-child(2) .legend-label::before { content: "地域型"; }
      .legend-item:nth-child(3) .legend-label::before { content: "小規模"; }
      .legend-item:nth-child(4) .legend-label::before { content: "エリマネ"; }
      .legend-item:nth-child(5) .legend-label::before { content: "AIR"; }
      .legend-item:nth-child(6) .legend-label::before { content: "美術館"; }
      .legend-item:nth-child(7) .legend-label::before { content: "工芸"; }
      .legend-item .legend-label::before { font-size: 8.5px; font-family: var(--serif); }

      /* Crosshair corners: pull tighter to map edges so they don't overlap UI */
      .map-wrapper::before { top: 8px; left: 8px; width: 12px; height: 12px; }
      .map-wrapper::after  { bottom: 28px; right: 8px; width: 12px; height: 12px; }

      .leaflet-control-zoom { margin: 8px !important; }

      /* ── Mobile: Leaflet's own popup is disabled (its pane is transformed, breaking position:fixed).
         We use an independent #mobile-sheet appended to <body> instead — see JS. ── */
      .leaflet-popup { display: none !important; }

      #mobile-sheet {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 2000;
        background: #14110d;
        border-top: 2px solid var(--accent);
        box-shadow: 0 -10px 34px rgba(0,0,0,0.8);
        max-height: 58vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        transform: translateY(100%);
        transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
        visibility: hidden;
      }
      #mobile-sheet.open {
        transform: translateY(0);
        visibility: visible;
      }
      #mobile-sheet .popup-inner {
        background: #14110d;
        padding: 16px 18px calc(14px + env(safe-area-inset-bottom, 0px));
        position: relative;
      }
      #mobile-sheet .sheet-close {
        position: absolute;
        top: 8px; right: 8px;
        width: 28px; height: 28px;
        line-height: 26px;
        text-align: center;
        font-family: var(--mono);
        font-size: 18px;
        color: var(--muted);
        background: var(--bg2);
        border: 1px solid var(--line2);
        cursor: pointer;
        z-index: 2;
      }
      #mobile-sheet .sheet-close:active { color: var(--accent); }
      .popup-inner { padding: 16px 18px 14px; }
      .popup-head { margin-bottom: 10px; padding-bottom: 8px; padding-right: 32px; }
      .popup-region { font-size: 8.5px; letter-spacing: 0.14em; }
      .popup-name { font-size: 15px; line-height: 1.3; margin-bottom: 4px; }
      .popup-tagline { font-size: 11px; margin-bottom: 10px; line-height: 1.45; }
      .popup-meta { gap: 6px 14px; padding: 8px 0; margin-bottom: 10px; }
      .popup-meta-k { font-size: 7.5px; letter-spacing: 0.14em; }
      .popup-meta-v { font-size: 12px; }
      .popup-desc { font-size: 11px; line-height: 1.6; margin-bottom: 12px; }
      .popup-btn-row { gap: 6px; }
      .popup-link, .popup-link-url { font-size: 9.5px !important; padding: 9px 6px !important; letter-spacing: 0.1em !important; }

      /* Map markers slightly bigger on touch for hit area */
      .map-wrapper .leaflet-marker-icon { touch-action: manipulation; }
    }

    /* Filter blocks */
    .filter-block {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .fl-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .fl-label-jp {
      font-family: var(--serif);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.06em;
    }
    .fl-label-en {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; }

    .chip {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 5px 9px;
      border: 1px solid var(--line2);
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: all 0.12s ease;
      white-space: nowrap;
      position: relative;
    }
    .chip[data-cat]:not([data-cat="all"]),
    .chip[data-year]:not([data-year="all"]),
    .chip[data-access]:not([data-access="all"]) {
      font-family: var(--serif);
      font-size: 11px;
      letter-spacing: 0.02em;
      font-weight: 500;
    }
    .chip:hover { border-color: var(--muted); color: var(--text); background: var(--bg2); }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .chip.active::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 2px;
      background: var(--accent);
    }

    /* Search */
    .search-block {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .search-block::before {
      content: '⌕';
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    .search-block input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--line2);
      padding: 10px 12px 10px 30px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.02em;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .search-block input:focus { border-color: var(--accent); background: var(--bg3); }
    .search-block input::placeholder {
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 10px;
    }

    /* List */
    .festival-list { flex: 1; overflow-y: auto; }
    .festival-list::-webkit-scrollbar { width: 4px; }
    .festival-list::-webkit-scrollbar-thumb { background: var(--line2); }
    .festival-list::-webkit-scrollbar-track { background: transparent; }

    .list-region-header {
      padding: 14px 20px 10px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      border-top: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .list-region-header:first-child { border-top: none; }

    .list-region-header .rh-num {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.1em;
    }
    .list-region-header .rh-jp {
      font-family: var(--serif);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: none;
      color: var(--text);
    }
    .list-region-header .rh-rule { flex: 1; height: 1px; background: var(--line2); }
    .list-region-header .rh-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .festival-item {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: grid;
      grid-template-columns: 22px 1fr 12px;
      gap: 10px;
      align-items: flex-start;
      transition: background 0.12s, padding 0.12s;
      position: relative;
    }
    .festival-item:hover { background: var(--bg2); }
    .festival-item.active { background: var(--bg3); padding-left: 22px; }
    .festival-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--accent);
    }

    .item-num {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--dim);
      letter-spacing: 0.08em;
      padding-top: 5px;
    }

    .item-dot { display: none; } /* superseded by num + cat strip */

    .item-cat-strip {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      vertical-align: middle;
      transform: translateY(-1px);
    }

    .item-name {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.35;
      margin-bottom: 4px;
      color: var(--text);
    }
    .item-pref {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .item-tagline {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.5;
      text-wrap: pretty;
    }

    .item-arrow {
      font-family: var(--serif);
      font-size: 14px;
      color: var(--dim);
      align-self: center;
      transition: color 0.15s, transform 0.15s;
    }
    .festival-item:hover .item-arrow { color: var(--accent); transform: translateX(3px); }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      font-family: var(--serif);
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .empty-state .es-en {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 6px;
      display: block;
    }

    /* ── MAP ─────────────────────────────────────────────── */
    .map-wrapper { position: relative; flex: 1; min-height: 0; background: var(--bg2); }
    #map { width: 100%; height: 100%; }

    /* Map overlay: corner crosshairs for editorial feel */
    .map-wrapper::before,
    .map-wrapper::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border: 1px solid var(--accent);
      pointer-events: none;
      z-index: 750;
      opacity: 0.6;
    }
    .map-wrapper::before {
      top: 18px; left: 18px;
      border-right: none; border-bottom: none;
    }
    .map-wrapper::after {
      bottom: 50px; right: 18px;
      border-left: none; border-top: none;
    }

    /* Top-right map meta plate */
    .map-meta {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 800;
      background: rgba(20,17,13,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--line2);
      padding: 7px 10px;
      min-width: 0;
      font-family: var(--mono);
      font-size: 8.5px;
    }
    .map-meta-row { display: flex; justify-content: space-between; padding: 1.5px 0; gap: 14px; }

const CASES = [
  { pref:"北海道", name:"札幌国際芸術祭（SIAF）", tagline:"都市型・メディアアートの拠点化", region:"北海道・東北", lat:43.06, lng:141.35, slug:"hokkaido", cat:"都市型芸術祭型", tags:[], desc:"札幌市の創造都市という思想と、豊かな自然と都市機能の調和、大学やIT産業が集まるメディアアーツ都市という特徴を生かした创造的な環境づくり。", url:"https://siaf.jp/", nextYear:"2027", tokyoHours:4 },
  { pref:"青森", name:"AOMORI GOKAN", tagline:"ミュージアム連携で県全体を編集", region:"北海道・東北", lat:40.82, lng:140.74, slug:"aomori", cat:"ミュージアム・拠点型", tags:[], desc:"県内の5つの美術館・アートセンターが連携し、青森のアートの魅力を国内外に発信するプロジェクト。県民及び観光客による県内の周遊を通して文化・経済・教育など幅広い分野での地域振興を目的とする。", url:"https://aomorigokan.com/", nextYear:"2026", tokyoHours:4 },
  { pref:"岩手", name:"三陸国際芸術祭", tagline:"郷土芸能×創造的復興", region:"北海道・東北", lat:39.7, lng:141.93, slug:"iwate", cat:"地域型芸術祭型", tags:[], desc:"三陸の伝統芸能に国内外のアーティストが共鳴することで、東日本大震災で被災した郷土芸能や文化芸術の復興を図るとともに、次世代の担い手育成や多様性のある文化の理解促進、国内外への三陸の魅力発信を目指す。", url:"https://sanfes.com/", nextYear:"不明", tokyoHours:3 },
  { pref:"宮城", name:"リボーンアートフェス", tagline:"震災復興と文化の接続", region:"北海道・東北", lat:38.43, lng:141.3, slug:"miyagi", cat:"地域型芸術祭型", tags:[], desc:"東日本大震災の被災地・石巻を舞台にしたアート/音楽/食の総合芸術祭。Reborn-Art＝人が生きる術をキーワードに、アーティストによる作品展示、地場食材を活かした食体験、多様な音楽ライブなどを実施。", url:"https://www.reborn-art-fes.jp/", nextYear:"不明", tokyoHours:3 },
  { pref:"秋田", name:"かみこあにプロジェクト", tagline:"小規模自治体の等身大実装", region:"北海道・東北", lat:40.22, lng:140.44, slug:"akita", cat:"小規模プロジェクト型", tags:[], desc:"秋田県で最も高齢化が高いとされる上小阿仁村で毎年行われる、現代アート・音楽・伝統芸能の3つを軸にした展示やイベントを行うプロジェクト。地元住民が中心となって実行委員会を結成し、持続的な取り組みを続ける。", url:"https://www.kamikoani-project.com/", nextYear:"2026", tokyoHours:4 },
  { pref:"山形", name:"山形ビエンナーレ", tagline:"街なか分散×文化回遊", region:"北海道・東北", lat:38.24, lng:140.36, slug:"yamagata", cat:"地域型芸術祭型", tags:[], desc:"東北芸術工科大学が主体となり2014年から隔年で開かれている芸術祭。街中の既存ストックを会場化して中心市街地活性化に寄与。2024年は初めて蔵王温泉で開催した。", url:"https://biennale.tuad.ac.jp/", nextYear:"2026", tokyoHours:3 },
  { pref:"福島", name:"ハマカルアートプロジェクト", tagline:"復興地域の文化接点づくり", region:"北海道・東北", lat:37.42, lng:141.03, slug:"fukushima", cat:"AIR・制作拠点型", tags:[], desc:"経済産業省の補助金を活用し、現在も一部避難指示が継続されている浜通り12市町村において、学生とともにアート活動を行う事業者や現地に滞在しながらアート活動を行う芸術家を支援する事業。", url:"https://hamacul-project.com/", nextYear:"2026", tokyoHours:3.5 },

  { pref:"群馬", name:"中之条ビエンナーレ", tagline:"温泉地×分散会場の回遊設計", region:"関東", lat:36.59, lng:138.85, slug:"gunma", cat:"地域型芸術祭型", tags:[], desc:"群馬県中之条町で隔年開催されるAIR型国際現代芸術祭。アーティストは特色ある山村地域のアーティスト・イン・レジデンスで美しい里山文化に触れながら滞在制作を行い、その成果を中之条ビエンナーレで発表する。", url:"https://nakanojo-biennale.com/", nextYear:"2027", tokyoHours:2.5 },
  { pref:"埼玉", name:"さいたま国際芸術祭", tagline:"大都市近郊の都市更新型", region:"関東", lat:35.86, lng:139.65, slug:"saitama", cat:"都市型芸術祭型", tags:[], desc:"さいたま市を舞台に3年に一度開催される芸術祭。市民と市民、市民とアーティスト、アーティストと地域が交流する機会を創出する市民参加型の芸術祭として、さいたま市内で広く開催される。", url:"https://artsaitama.jp/", nextYear:"2027", tokyoHours:0.5 },
  { pref:"千葉", name:"千葉国際芸術祭", tagline:"都市近郊の回遊・再編集", region:"関東", lat:35.61, lng:140.12, slug:"chiba", cat:"都市型芸術祭型", tags:[], desc:"千葉市において3年に1回開催されるトリエンナーレ方式の芸術祭として2025年に始動。一時的な観光集客ではなく、千葉市内外に暮らす人々の創造性を刺激し、中長期的に日常を豊かにすることを重視する。", url:"https://artstriennale.city.chiba.jp/", nextYear:"2028", tokyoHours:0.5 },
  { pref:"東京", name:"東京ビエンナーレ", tagline:"都市を実験場にするプロジェクト型", region:"関東", lat:35.7, lng:139.77, slug:"tokyo", cat:"都市型芸術祭型", tags:[], desc:"2020/21に始まった都市空間を舞台に2年に一度開催される国際芸術祭。千代田区・中央区・文京区・台東区で作品を展開。美術館ではなく街角や地下道、歴史的建築物など日常の風景の中でアートが展開される。", url:"https://tokyobiennale.jp/", nextYear:"2027", tokyoHours:0 },
  { pref:"神奈川", name:"黄金町エリアマネジメント/バザール", tagline:"課題エリアをアートで再編集", region:"関東", lat:35.44, lng:139.63, slug:"kanagawa", cat:"エリアマネジメント型", tags:[], desc:"かつて特殊飲食店がひしめいていたエリアを2005年頃からアートを核に再生。2008年から年に1度の黄金町バザールを開始、2009年にNPO法人黄金町エリアマネジメントセンターが発足し継続的なまちづくりが進む。", url:"https://koganecho.net/", nextYear:"2026", tokyoHours:0.5 },
  { pref:"新潟", name:"大地の芸術祭", tagline:"地域芸術祭のフラッグシップ", region:"中部", lat:37.09, lng:138.76, slug:"niigata", cat:"地域型芸術祭型", tags:[], desc:"世界最大級の国際芸術祭であり、日本中で開催されている地域芸術祭のパイオニア。アートを道しるべに里山を巡る新しい旅は、アートによる地域づくりの先進事例として国内外から注目を集める。3年に1回の芸術祭のほか期間外も季節ごとにイベントを開催。", url:"https://www.echigo-tsumari.jp/", nextYear:"2027", tokyoHours:2.5 },
  { pref:"富山", name:"ガラスの街とやま", tagline:"産業×文化で都市ブランド形成", region:"中部", lat:36.7, lng:137.21, slug:"toyama", cat:"産業・工芸連携型", tags:[], desc:"富山の産業であるガラスの街づくりを市の施策として定め、2015年に完成したガラス美術館を軸に、造形研究所・ガラス工房など市全体でガラスを活用した街づくりを推進する。", url:"https://www.info-toyama.com/stories/summer2021/glass", nextYear:"通年", tokyoHours:2.5 },
  { pref:"石川", name:"Go FOR KOGEI", tagline:"工芸を現代文脈に接続", region:"中部", lat:36.59, lng:136.63, slug:"ishikawa", cat:"産業・工芸連携型", tags:[], desc:"ものづくりが古くから受け継がれる北陸から新たな工芸の見方を発信するプロジェクト。地域の歴史・風土を体現する町並みや社寺を会場にした展覧会のほか、工芸をめぐるシンポジウムなども開催。2020年に開始。", url:"https://goforkogei.com/", nextYear:"通年", tokyoHours:3 },
  { pref:"福井", name:"Zen AIR（禅×AIR）", tagline:"テーマ特化の滞在制作", region:"中部", lat:36.07, lng:136.22, slug:"fukui", cat:"AIR・制作拠点型", tags:[], desc:"禅の里として知られる福井県永平寺町を会場に、アーティストが禅文化に触れ地元住民と交流しながら制作・研究する機会を提供するテーマ特化型レジデンス。滞在成果を作品や研究として発信する。", url:"https://zen-air.org/", nextYear:"不明", tokyoHours:4 },
  { pref:"山梨", name:"FUJI TEXTILE WEEK", tagline:"産地×デザインのブランディング", region:"中部", lat:35.47, lng:138.8, slug:"yamanashi", cat:"産業・工芸連携型", tags:[], desc:"1000年以上続く織物産地・山梨県富士吉田市の歴史を根底に、伝統産業および地域活性を目的として2021年よりスタートしたテキスタイルと芸術が融合する国内唯一の布の芸術祭。", url:"https://fujitextileweek.com/", nextYear:"2026", tokyoHours:2.5 },
  { pref:"長野", name:"北アルプス国際芸術祭", tagline:"山岳地帯の自然とアートが共鳴", region:"中部", lat:36.5, lng:137.85, slug:"nagano", cat:"地域型芸術祭型", tags:[], desc:"自然豊かな長野県大町市を舞台に、まちの潜在的な魅力を引き出し市民が協働で個性的なまちづくりを進める一環として、2017年に第1回、2021年に第2回、2024年に第3回を開催。", url:"https://shinano-omachi.jp/", nextYear:"2029", tokyoHours:3 },
  { pref:"岐阜", name:"美濃和紙あかりアート展", tagline:"参加型で市民の誇りをつくる", region:"中部", lat:35.54, lng:136.91, slug:"gifu", cat:"産業・工芸連携型", tags:[], desc:"美濃和紙を使った約300点のあかりアート作品が、うだつの上がる町並みを柔らかな光で包む四半世紀以上続く幻想的な展覧会。全国から作品を募集し、入賞作品を展示・審査する参加型イベント。", url:"https://www.akariart.jp/", nextYear:"2026", tokyoHours:3.5 },
  { pref:"静岡", name:"アーツカウンシルしずおか", tagline:"支援制度で文化エコシステム形成", region:"中部", lat:34.98, lng:138.38, slug:"shizuoka", cat:"小規模プロジェクト型", tags:[], desc:"静岡県内の文化芸術活動を助成・相談・情報発信によって支える中間支援組織。単発の事業補助にとどまらず、アーティストやNPOの活動継続を長期的に伴走する仕組みを持ち、行政と民間の橋渡し役として機能する。", url:"https://artscouncil-shizuoka.jp/", nextYear:"通年", tokyoHours:1.5 },
  { pref:"愛知", name:"国際芸術祭「あいち」", tagline:"大都市圏の国際芸術祭モデル", region:"中部", lat:35.18, lng:136.91, slug:"aichi", cat:"都市型芸術祭型", tags:[], desc:"愛知県が3年に1度開催する国際現代芸術祭。愛知芸術文化センターのほか県内都市のまちなかを会場として広域に展開。現代美術を基軸に、パフォーミングアーツ・ラーニングなどジャンルを横断してアートの多様性を発信。", url:"https://aichitriennale.jp/index.html", nextYear:"2028", tokyoHours:2 },
  { pref:"三重", name:"亀山トリエンナーレ", tagline:"創作が生まれる場づくり型", region:"中部", lat:34.85, lng:136.45, slug:"mie", cat:"小規模プロジェクト型", tags:[], desc:"三重県亀山市が推進するアートまちづくり事業。このまちに暮らす人々の営みの中で培われ時代・世代を超えて継承される心動かすものをアートと捉え、2014年から3年に1度の芸術祭を実施。", url:"https://www.kankomie.or.jp/special/art-kameyama/#top", nextYear:"通年", tokyoHours:3 },
  { pref:"滋賀", name:"BIWAKOビエンナーレ", tagline:"歴史ストック×分散展示", region:"関西", lat:35.13, lng:136.1, slug:"shiga", cat:"地域型芸術祭型", tags:[], desc:"滋賀県近江八幡市の古民家・町家・蔵などの歴史的建造物を主会場に、2年に1度開催される国際芸術祭。国内外のアーティストが建物の記憶や空間性に呼応したインスタレーションを制作し、街全体がミュージアムと化す。", url:"https://energyfield.org/biwakobiennale/", nextYear:"2027", tokyoHours:3 },
  { pref:"京都", name:"KYOTOGRAPHIE", tagline:"分野特化で都市回遊を生む", region:"関西", lat:35.01, lng:135.77, slug:"kyoto", cat:"都市型芸術祭型", tags:[], desc:"京都の社寺・町家・近代建築・公共空間を会場に、毎年春に開催される国際写真フェスティバル。2013年に始まり、写真という単一分野に特化することで強いブランドを確立。市民参加型のKG+も同時開催される。", url:"https://www.kyotographie.jp/", nextYear:"2026", tokyoHours:2.5 },
  { pref:"大阪", name:"北加賀屋クリエイティブ・ビレッジ", tagline:"民間主導の空間再生×制作拠点集積", region:"関西", lat:34.62, lng:135.49, slug:"osaka", cat:"エリアマネジメント型", tags:[], desc:"大阪市住之江区・北加賀屋の造船所跡地を地場の不動産会社・千島土地が民間主導で段階的に再生したアート拠点群。行政補助に依存せず、低廉な賃料と柔軟な空間運用によって多様なクリエイターを呼び込む。", url:"https://chishima-foundation.com/cruising", nextYear:"通年", tokyoHours:3.5 },
  { pref:"兵庫", name:"神戸・新開地（アートひろば等）", tagline:"下町エリアの文化再生", region:"関西", lat:34.69, lng:135.19, slug:"hyogo", cat:"エリアマネジメント型", tags:[], desc:"かつて西日本最大の歓楽街として賑わい衰退した神戸・新開地エリアで展開するアートを核にした再生の取り組み。遊休ビルや空き店舗をアートスペース・稽古場・小劇場として活用し、地域の担い手育成と文化拠点化を進める。", url:"https://s-ah.jp/", nextYear:"通年", tokyoHours:3.5 },
  { pref:"奈良", name:"はならぁと", tagline:"集落・空き家を面で使う", region:"関西", lat:34.69, lng:135.83, slug:"nara", cat:"小規模プロジェクト型", tags:[], desc:"奈良県内の集落・町家・空き家・寺社などを会場にした分散型芸術祭。橿原・宇陀・吉野など県内各地を複数エリアに分けて順次開催し、観光客が普段訪れない集落や空き家へと回遊を生む。", url:"https://hanarart.jp/2025/", nextYear:"不明", tokyoHours:3.5 },
  { pref:"和歌山", name:"JAPAN WALLS（和歌山）", tagline:"国際ミューラルで景観を更新", region:"関西", lat:34.23, lng:135.17, slug:"wakayama", cat:"小規模プロジェクト型", tags:[], desc:"国内外のストリートアーティストを招聘し、和歌山市内の建物外壁に大型ウォールアートを制作するプロジェクト。街の景観を一変させるビジュアルインパクトの高さからSNSでの拡散力が強く、新たな来街者を生み出す。", url:"https://prtimes.jp/main/html/rd/p/000000015.000067444.html", nextYear:"通年", tokyoHours:5 },
  { pref:"鳥取", name:"鳥取県立美術館の取り組み", tagline:"人づくりを核にした美術館整備", region:"中国・四国", lat:35.5, lng:134.24, slug:"tottori", cat:"AIR・制作拠点型", tags:[], desc:"2025年に倉吉市にオープンした鳥取県立美術館を核に、整備段階から地域との対話を重ねて進められてきた文化政策。民藝運動ゆかりの地・鳥取の風土を活かしながら、県民の学び・交流・創造活動の拠点として設計。", url:"https://tottori-moa.jp/", nextYear:"通年", tokyoHours:5.5 },
  { pref:"島根", name:"石見アーツプロジェクト", tagline:"教育・地域定着の底上げ型", region:"中国・四国", lat:34.68, lng:131.98, slug:"shimane", cat:"小規模プロジェクト型", tags:[], desc:"島根県石見地域を対象にした文化芸術振興の取り組み。石見神楽・石見銀山・石州和紙といった地域固有の文化資源を現代のアート表現と接続しながら、若い世代のアーティストや文化関係者の移住・定住を促進する。", url:"https://artsiwami.localinfo.jp/", nextYear:"通年", tokyoHours:6 },
  { pref:"岡山", name:"岡山芸術交流", tagline:"都市中核の国際展でブランド形成", region:"中国・四国", lat:34.66, lng:133.93, slug:"okayama", cat:"地域型芸術祭型", tags:[], desc:"岡山市の城下町エリアを主会場に、3年に1度開催される国際現代芸術展。林原美術館・旧内山下小学校など歴史的な建物や公共空間を使い、世界水準のインスタレーションを展開する。徒歩で回遊できるコンパクトな会場配置が特色。", url:"https://www.okayamaartsummit.jp/", nextYear:"2028", tokyoHours:3 },
  { pref:"広島", name:"広島国際建築祭", tagline:"建築で都市を読み解く専門特化型", region:"中国・四国", lat:34.4, lng:133.4, slug:"hiroshima", cat:"地域型芸術祭型", tags:[], desc:"2025年から開始された建築という専門分野に特化した広島発の国際フェスティバル。福山市・尾道市などを中心に、現代建築を巡るツアーや展示・シンポジウムを通じて都市の記憶・復興・再生を多角的に問い直す。", url:"https://hiroshima-architecture-exhibition.jp/", nextYear:"2028", tokyoHours:4 },
  { pref:"山口", name:"YCAM（山口情報芸術センター）", tagline:"公共R&D拠点型メディアアート", region:"中国・四国", lat:34.19, lng:131.47, slug:"yamaguchi", cat:"ミュージアム・拠点型", tags:[], desc:"山口市が設置した公共のメディアアート施設。アート・テクノロジー・研究を統合したR&D機能を持ち、展覧会・パフォーマンス・市民ワークショップから国際的な共同制作まで幅広く展開。アーティストとエンジニアが共同制作する体制が国内唯一レベル。", url:"https://www.ycam.jp/", nextYear:"通年", tokyoHours:5 },
  { pref:"徳島", name:"神山AIR", tagline:"AIR起点の社会実装", region:"中国・四国", lat:33.85, lng:134.22, slug:"tokushima", cat:"AIR・制作拠点型", tags:[], desc:"徳島県神山町で展開するアーティスト・イン・レジデンスプログラム。1990年代後半から始まり、滞在制作を入口にITサテライトオフィスの誘致・移住者受け入れ・空き家再生へと波及。地方創生政策に大きな影響を与えた神山モデルの原点。", url:"https://www.in-kamiyama.jp/art/", nextYear:"通年", tokyoHours:5 },
  { pref:"香川", name:"瀬戸内国際芸術祭", tagline:"広域分散×国際発信の代表格", region:"中国・四国", lat:34.33, lng:134.04, slug:"kagawa", cat:"地域型芸術祭型", tags:[], desc:"瀬戸内海の島々と港を舞台に3年に1度開催される大規模な国際芸術祭。直島・豊島・女木島・小豆島など12の島と2つの港を会場に、国内外のアーティストによる常設・期間限定作品が展開。来場者数は毎回100万人を超える。2025年に本祭を開催済みで、次回本祭は2028年。2026年は会期外プログラム「ART SETOUCHI」を実施。", url:"https://setouchi-artfest.jp/", nextYear:"2028", tokyoHours:5 },
  { pref:"愛媛", name:"道後オンセアート", tagline:"成熟観光地をアートで再編集", region:"中国・四国", lat:33.84, lng:132.77, slug:"ehime", cat:"小規模プロジェクト型", tags:[], desc:"愛媛県松山市の道後温泉を舞台に開催されるアートフェスティバル。国内最古の温泉地として知られる道後の旅館・公衆浴場・商店街をギャラリーに見立て、国内外のアーティストによるインスタレーションや体験型作品を展開する。", url:"https://dogoonsenart.com/", nextYear:"通年", tokyoHours:3.5 },
  { pref:"高知", name:"高知県芸術祭/KOCHI ART PROJECTS", tagline:"プロセス重視の思考実践", region:"中国・四国", lat:33.56, lng:133.53, slug:"kochi", cat:"小規模プロジェクト型", tags:[], desc:"高知県が毎年秋に開催する総合芸術祭（2025年で第75回）を母体に、アート×まちづくりをテーマにした助成・実践プログラムKOCHI ART PROJECTSを展開。演劇・音楽・美術・伝統文化など多彩な部門と地域まちづくりに直結するアートプロジェクトを組み合わせる。", url:"https://www.kochi-art.com/", nextYear:"2026", tokyoHours:4 },
  { pref:"福岡", name:"Fukuoka Art Next", tagline:"文化政策としてのアート戦略", region:"九州・沖縄", lat:33.59, lng:130.4, slug:"fukuoka", cat:"小規模プロジェクト型", tags:[], desc:"福岡市が2022年度に始動した包括的な文化政策。産学官が連携し、市民がアートに触れる機会の創出とアーティストの成長・交流拠点の整備を同時に推進。Artist Cafe Fukuoka、ウォールアート掲出、アートフェアアジア福岡など多角的に展開する。", url:"https://fukuoka-art-next.jp/", nextYear:"通年", tokyoHours:3.5 },
  { pref:"佐賀", name:"Creative Residency in Arita", tagline:"産地×AIRで有田焼を更新", region:"九州・沖縄", lat:33.19, lng:129.88, slug:"saga", cat:"産業・工芸連携型", tags:[], desc:"磁器発祥の地・有田で国内外のアーティストやデザイナーが3ヶ月間滞在し、地元の窯元・職人とのコラボレーションを通じた創作活動を行う。オランダ王国大使館との連携を基盤に2016年から始まり、有田焼ブランドの国際的更新を推進。", url:"https://cri-arita.com/ja/", nextYear:"2026", tokyoHours:4 },
  { pref:"長崎", name:"南島原市アートビレッジ・シラキノ", tagline:"公共施設×AIRの実装", region:"九州・沖縄", lat:32.65, lng:130.31, slug:"nagasaki", cat:"ミュージアム・拠点型", tags:[], desc:"長崎県南島原市の廃校を若手芸術家の支援と地域文化の発展を目的とした芸術文化複合施設として改修。国内外のアーティストが一定期間滞在して制作を行い、地域住民との交流やワークショップを通じて地域に創造の拠点を築く。", url:"https://www.artvillage-shirakino.jp/", nextYear:"通年", tokyoHours:4.5 },
  { pref:"熊本", name:"くまもとアートポリス", tagline:"制度化されたデザイン行政", region:"九州・沖縄", lat:32.8, lng:130.71, slug:"kumamoto", cat:"小規模プロジェクト型", tags:[], desc:"熊本県が1988年から継続する公共建築・空間デザイン向上施策。著名建築家をコミッショナーに迎え、県内の公共施設・橋梁・道路・公園など幅広いインフラにデザインの質を実装し続けている。現在のコミッショナーは伊東豊雄。", url:"https://www.pref.kumamoto.jp/soshiki/115/85889.html", nextYear:"通年", tokyoHours:4 },
  { pref:"大分", name:"BEPPU PROJECT", tagline:"中間組織が都市を運用する", region:"九州・沖縄", lat:33.28, lng:131.49, slug:"oita", cat:"小規模プロジェクト型", tags:[], desc:"別府市を拠点とするNPOが主導するアートプロジェクト。温泉街の遊休施設を活用した国際芸術祭を起点に、AIR・人材育成・拠点運営・食と文化の発信まで多角的に展開。行政と民間の間で実装を回す中間支援型の運用体制が突出している。", url:"https://www.beppuproject.com/", nextYear:"通年", tokyoHours:4 },
  { pref:"宮崎", name:"新富芸術祭", tagline:"小規模自治体の等身大芸術祭", region:"九州・沖縄", lat:32.07, lng:131.51, slug:"miyazaki", cat:"地域型芸術祭型", tags:[], desc:"新富町で開催される小規模自治体型の芸術祭。農村の田園風景・住民の日常・歴史的な祭祀空間をフィールドに、国内外のアーティストと地域住民が協働して作品を制作・展示。地域への負荷が小さく持続可能な設計が特徴。", url:"https://shintomi-art.jp/", nextYear:"不明", tokyoHours:5 },
  { pref:"鹿児島", name:"霧島アートの森活用まちづくり", tagline:"強い拠点を市域へ波及", region:"九州・沖縄", lat:31.92, lng:130.86, slug:"kagoshima", cat:"ミュージアム・拠点型", tags:[], desc:"湧水町にある県立野外美術館・霧島アートの森を核にしたまちづくり。霧島連山の火山地形と豊かな自然の中に国内外の彫刻・インスタレーション作品が点在し、鑑賞・教育・自然体験が一体となった場を形成する。", url:"https://open-air-museum.org/", nextYear:"通年", tokyoHours:5 },

  { pref:"東京", name:"恵比寿映像祭2026", tagline:"映像・写真の国際フェスティバル", region:"関東", lat:35.65, lng:139.71, slug:"", cat:"ミュージアム・拠点型", tags:[], desc:"東京都写真美術館が主催する映像表現の国際フェスティバル。「映像とは何か」を問い続けながら、写真・映像・サウンド・パフォーマンスなど多様な表現を紹介する。2026年は「あなたの音に｜日花聲音｜Polyphonic Voices Bathed in Sunlight」がテーマ。", url:"https://topmuseum.jp/contents/exhibition/index-5091.html", nextYear:"2026", tokyoHours:0 },
  { pref:"東京", name:"東京建築祭2026", tagline:"普段入れない建築を巡る都市型祭典", region:"関東", lat:35.68, lng:139.76, slug:"", cat:"小規模プロジェクト型", tags:[], desc:"「建築から、ひとを感じる、まちを知る。」を理念に、普段公開されていない東京都内の名建築を一般公開するイベント。2024年初開催で6.5万人を動員。専門家・建築主によるガイドツアーも実施し、建築好きから初心者まで楽しめる。", url:"https://tokyo2026.kenchikusai.jp/", nextYear:"2026", tokyoHours:0 },
  { pref:"東京", name:"すみだ五彩の芸術祭", tagline:"23区初の区主催総合芸術祭", region:"関東", lat:35.71, lng:139.80, slug:"", cat:"都市型芸術祭型", tags:[], desc:"墨田区が主催する、東京23区では初となる区主催の数ヶ月規模の総合芸術祭。「墨に五彩あり」という言葉を手がかりに、地域の歴史・産業・人々の記憶に光を当てる。古民家・寺・商店街など街そのものが表現の場となる。", url:"https://sumida-artfest.jp/", nextYear:"2026", tokyoHours:0 },
  { pref:"東京", name:"TOKYO ATLAS（国際文化芸術祭）", tagline:"都主導の新たな国際美術展", region:"関東", lat:35.63, lng:139.78, slug:"", cat:"都市型芸術祭型", tags:[], desc:"東京都が2026年に始動する新たな文化芸術祭の一環として、臨海部（お台場・青海南ふ頭・天王洲）で開催される国際的な美術展。「お台場トリエンナーレ」の蓄積を引き継ぎ、世界的アーティストと東京都が支援してきた若手作家を紹介する。", url:"https://tokyoatlas.jp/", nextYear:"2026", tokyoHours:0 },
  { pref:"群馬", name:"前橋国際芸術祭2026「めぶく。」", tagline:"再開発と連動する初開催の国際芸術祭", region:"関東", lat:36.39, lng:139.06, slug:"", cat:"都市型芸術祭型", tags:[], desc:"前橋市の中心市街地を舞台に初開催される国際芸術祭。2016年策定のまちづくりビジョン「めぶく。」から10年の節目に開催され、建築家・藤本壮介らが手がけた再開発と連動。商店街・空きビル・公共空間を舞台にウォーカブルなアート体験を展開する。", url:"https://maebashi-biennale.com/", nextYear:"2026", tokyoHours:1.5 },

  { pref:"山梨", name:"富士山芸術祭2026", tagline:"富士山と山梨の文化資源を結ぶ広域回遊型芸術祭", region:"中部", lat:35.49, lng:138.76, slug:"", cat:"地域型芸術祭型", tags:[], desc:"富士山という世界遺産を中心に、山梨県内の歴史的建造物・寺院・美術館・酒蔵・偉人ゆかりの地を結ぶ広域回遊型の芸術祭。4年に1度開催され、伝統工芸と現代アートを接続し地域に眠る価値を掘り起こす。", url:"https://fujisan-artfes.jp/", nextYear:"2026", tokyoHours:2 },

  { pref:"兵庫", name:"神戸六甲ミーツ・アート2026 beyond", tagline:"六甲山上を舞台にした現代アートの芸術祭", region:"関西", lat:34.76, lng:135.25, slug:"", cat:"地域型芸術祭型", tags:[], desc:"神戸・六甲山上で毎年秋に開催される現代アートの芸術祭。2010年から継続しており、六甲山の豊かな自然環境の中に作品が点在する。神戸市街地からのアクセスの良さと自然体験を両立した都市近郊型の芸術祭。", url:"https://rokkomeetsart.jp/", nextYear:"2026", tokyoHours:3 },

  { pref:"北海道", name:"飛生芸術祭", tagline:"森と旧校舎に生まれるおとぎ話の世界", region:"北海道・東北", lat:42.55, lng:141.35, slug:"", cat:"小規模プロジェクト型", tags:[], desc:"北海道白老町の飛生（とびう）地区、廃校となった旧飛生小学校を拠点に1986年発足した飛生アートコミュニティーが開く年に一度の芸術祭。木造校舎と周囲の森を展覧会場に、多様な表現をお披露目し交流する。オープニングイベントTOBIU CAMPも同時開催。", url:"https://tobiu.com/about/", nextYear:"2026", tokyoHours:1.5 },
  { pref:"福島", name:"福島ビエンナーレ2026", tagline:"双葉郡の歴史と現代アートで描く復興祈念の祭典", region:"北海道・東北", lat:37.35, lng:141.00, slug:"", cat:"地域型芸術祭型", tags:[], desc:"2004年から隔年開催されてきた現代アートの企画。東日本大震災15年復興祈念として、双葉郡8町村（浪江町・双葉町・大熊町・富岡町・楢葉町・広野町・葛尾村・川内村）を舞台に「Cinematic ∞ Art」をテーマに現代アートを展開する。福島大学と地域住民の協働による地域文化伝承の場。", url:"https://wa-art.com/bien/bien2026/index.html", nextYear:"2026", tokyoHours:3 },
  { pref:"栃木", name:"AWANO 夢咲くART FESTIVAL 2026", tagline:"里山の花と芸術と食を楽しむ地域密着型芸術祭", region:"関東", lat:36.51, lng:139.66, slug:"", cat:"小規模プロジェクト型", tags:[], desc:"栃木県鹿沼市粟野地域を舞台に2016年から開催される芸術祭。現役の粟野中学校とレトロな旧粟野中学校を中心に、そばの花・彼岸花など四季折々の里山景観の中でアーティストの展覧会・アートステージ・マルシェを展開する。2026年で9回目。", url:"https://awanoartfestival.com/", nextYear:"2026", tokyoHours:2 },
  { pref:"千葉", name:"房総国際芸術祭 アート×ミックス2027", tagline:"北川フラム総合ディレクターによる房総半島縦断の芸術祭", region:"関東", lat:35.42, lng:140.10, slug:"", cat:"地域型芸術祭型", tags:[], desc:"千葉県市原市・木更津市・大多喜町を舞台にした新しい国際芸術祭。総合ディレクター北川フラム、総合プロデューサー小林武史のもと、房総半島を鉄道・車・自転車で旅しながらアートと音楽・食を楽しむ「みんなの美術工場」構想を展開する。", url:"https://boso-artmix.com/about", nextYear:"2027", tokyoHours:1.5 },
  { pref:"神奈川", name:"横浜トリエンナーレ", tagline:"3年に1度、世界とつながる現代アートの国際展", region:"関東", lat:35.45, lng:139.63, slug:"", cat:"都市型芸術祭型", tags:[], desc:"2001年開始、日本を代表する国際現代アート展。みなとみらい地区をはじめとする横浜都心臨海部を会場に3年に1度開催。第9回はコスミン・コスティナシュとインティ・ゲレロがアーティスティック・ディレクターを務める。", url:"https://www.yokohamatriennale.jp/", nextYear:"不明", tokyoHours:0.5 },

  { pref:"福井", name:"熊川宿若狭芸術祭", tagline:"歴史的宿場町で「臨場と共生」をテーマに滞在制作", region:"中部", lat:35.48, lng:135.93, slug:"", cat:"AIR・制作拠点型", tags:[], desc:"福井県若狭町の熊川宿を「世界の文化交流拠点地域」として発展させることを目指し2023年度から開催。性別・年齢・国籍・障がいの有無を問わず多様な表現者が短期滞在制作・展覧会・音楽会を行う。海外アーティストも参加する若狭町・県共催の芸術祭。", url:"https://kumagawa-art.jp/", nextYear:"不明", tokyoHours:4 },
  { pref:"長野", name:"浅間国際フォトフェスティバル（PHOTO MIYOTA）", tagline:"浅間山麓で写真を五感で味わう国際写真祭", region:"中部", lat:36.34, lng:138.55, slug:"", cat:"ミュージアム・拠点型", tags:[], desc:"長野県御代田町の文化複合施設MMoP（旧メルシャン軽井沢美術館）を中心会場に2018年から開催される国際写真フェスティバル。浅間山麓の自然の中で国内外の写真家の作品を展示。2026年は町内各所へ展示エリアを拡大し、来場者数は過去最多の3万3千人を記録。", url:"https://asamaphotofes.jp/", nextYear:"2026", tokyoHours:2.5 },

  { pref:"岡山", name:"森の芸術祭 晴れの国・岡山2027", tagline:"岡山県北部12市町村を舞台にした国際芸術祭", region:"中国・四国", lat:35.07, lng:133.75, slug:"", cat:"地域型芸術祭型", tags:[], desc:"岡山県北部12市町村（津山市・高梁市・新見市・真庭市・美作市など）を舞台にした国際芸術祭。2024年の常設作品（マイケル・リン、妹島和世ら）は引き続き鑑賞可能。次回2027年秋開催予定。", url:"https://forestartfest-okayama.jp/", nextYear:"不明", tokyoHours:4.5 },

const IMPACT_PREFIX = { "経済": "1-", "社会": "2-", "文化": "3-" };
const REGION_ORDER = ["北海道・東北","関東","中部","関西","中国・四国","九州・沖縄"];
const REGION_NUM = { "北海道・東北":"01","関東":"02","中部":"03","関西":"04","中国・四国":"05","九州・沖縄":"06" };

let activeCat = "all", activeYear = "all", activeAccess = "all", searchQ = "";

function getFiltered() {
  return CASES.filter(c => {
    if (activeCat !== "all" && c.cat !== activeCat) return false;

    // Year filter — match if nextYear contains the selected year string
    if (activeYear !== "all") {
      if (activeYear === "通年") {
        if (c.nextYear !== "通年") return false;
      } else {
        if (!c.nextYear.includes(activeYear)) return false;
      }
    }

    // Access filter
    if (activeAccess !== "all") {
      const h = c.tokyoHours;
      const a = Number(activeAccess);
      if (a === 1 && h > 1) return false;
      if (a === 2 && (h <= 1 || h > 2)) return false;
      if (a === 3 && (h <= 2 || h > 3)) return false;
      if (a === 4 && (h <= 3 || h > 4)) return false;
      if (a === 99 && h <= 4) return false;
    }

    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!c.name.toLowerCase().includes(q) && !c.pref.includes(q) && !c.tagline.includes(q)) return false;
    }
    return true;
  });
}

// MAP — Stamen Toner Lite gives a clean editorial canvas; falls back gracefully.
const map = L.map('map', { center: [37.0, 137.5], zoom: 6, zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19,
  pane: 'shadowPane',
  opacity: 0.85
}).addTo(map);

let markers = [];

function markerIcon(c, active) {
  const color = CAT_COLORS[c.cat] || "#888";
  const s = active ? 26 : 18;
  const inner = active ? 10 : 6;
  const ring = active ? `box-shadow:0 0 0 1px #fff, 0 0 0 4px ${color}66, 0 4px 14px rgba(0,0,0,0.4);` : `box-shadow:0 0 0 1px rgba(255,255,255,0.85), 0 2px 8px rgba(0,0,0,0.35);`;
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:${s}px;height:${s}px;">
      <div style="position:absolute;inset:0;border-radius:50%;background:${color};${ring}transition:all 0.18s ease;"></div>
      <div style="position:absolute;top:50%;left:50%;width:${inner}px;height:${inner}px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);"></div>
      <div style="position:absolute;inset:-8px;cursor:pointer"></div>
    </div>`,
    iconSize: [s, s],
    iconAnchor: [s/2, s/2],
    popupAnchor: [0, -(s/2+6)]
  });
}

function popupHtml(c) {
  const color = CAT_COLORS[c.cat] || "#888";
  const accessLabel = c.tokyoHours === 0 ? '都内' : `約 ${c.tokyoHours}h`;
  const yearLabel = c.nextYear || '—';
  return `<div class="popup-inner">
    <div class="popup-head">
      <div class="popup-cat-sq" style="background:${color}"></div>
      <div class="popup-region"><span class="accent-mark">${c.cat}</span> · ${c.pref}</div>
    </div>
    <div class="popup-name">${c.name}</div>
    <div class="popup-tagline">${c.tagline}</div>
    <div class="popup-meta">
      <div class="popup-meta-item"><span class="popup-meta-k">Next Edition</span><span class="popup-meta-v">${yearLabel}</span></div>
      <div class="popup-meta-item"><span class="popup-meta-k">From Tokyo</span><span class="popup-meta-v">${accessLabel}</span></div>
    </div>
    <div class="popup-desc">${c.desc}</div>
    <div class="popup-btn-row">
      ${c.slug ? `<a class="popup-link" href="https://bawb199765-bot.github.io/Art_PlaceMaking/detail-${c.slug}.html" target="_blank">詳細を見る →</a>` : ''}
      ${c.url ? `<a class="popup-link-url" href="${c.url}" target="_blank">公式サイト<span style="font-size:0.75em;letter-spacing:0.04em;margin-left:2px;">など</span></a>` : ''}
    </div>
  </div>`;
}

function rebuild() {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];
  const filtered = getFiltered();

  filtered.forEach((c, i) => {
    const marker = L.marker([c.lat, c.lng], { icon: markerIcon(c, false) }).addTo(map);
    const isMobile = window.innerWidth <= 768;
    if (!isMobile) {
      marker.bindPopup(popupHtml(c), {
        maxWidth: 280,
        closeButton: true,
        autoPan: true,
        autoPanPadding: [20, 20]
      });
    }
    marker.on('click', () => {
      setActive(i);
      scrollListTo(i);
      if (window.innerWidth <= 768) {
        openMobileSheet(c);
      }
    });
    markers.push({ marker, case: c, idx: i });
  });
  renderList(filtered);
}

// ── Standalone mobile bottom sheet (lives directly under <body>, unaffected by Leaflet's transformed panes) ──
const mobileSheet = document.getElementById('mobile-sheet');

function openMobileSheet(c) {
  mobileSheet.innerHTML = popupHtml(c) + '<div class="sheet-close" onclick="closeMobileSheet()">✕</div>';
  mobileSheet.classList.add('open');
  document.body.classList.add('popup-open');
  setTimeout(() => {
    map.invalidateSize();
    const sheetH = mobileSheet.offsetHeight || Math.round(window.innerHeight * 0.45);
    const mapH = map.getSize().y;
    const visibleH = Math.max(mapH - sheetH, 120);
    const targetY = visibleH / 2;
    const pt = map.latLngToContainerPoint([c.lat, c.lng]);
    map.panBy([0, Math.round(pt.y - targetY)], { animate: true, duration: 0.25 });
  }, 80);
}

function closeMobileSheet() {
  mobileSheet.classList.remove('open');
  document.body.classList.remove('popup-open');
  setTimeout(() => map.invalidateSize(), 60);
}
window.closeMobileSheet = closeMobileSheet;

function setActive(idx) {
  markers.forEach((m, i) => m.marker.setIcon(markerIcon(m.case, i === idx)));
}

function scrollListTo(idx) {
  document.querySelectorAll('.festival-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.festival-item[data-idx="${idx}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

function renderList(filtered) {
  const list = document.getElementById('festival-list');
  // header counters
  const showEl = document.getElementById('hd-showing'); if (showEl) showEl.textContent = String(filtered.length).padStart(3,'0');
  const totalEl = document.getElementById('hd-total');  if (totalEl) totalEl.textContent = String(CASES.length).padStart(3,'0');
  const mapShow = document.getElementById('map-showing'); if (mapShow) mapShow.textContent = String(filtered.length).padStart(3,'0') + ' / ' + String(CASES.length).padStart(3,'0');

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">該当する取り組みがありません<span class="es-en">No results</span></div>';
    return;
  }
  const groups = {};
  REGION_ORDER.forEach(r => { groups[r] = []; });
  filtered.forEach((c, i) => { if (groups[c.region]) groups[c.region].push({ c, i }); });
  let html2 = '';
  REGION_ORDER.forEach(region => {
    if (!groups[region].length) return;
    const num = REGION_NUM[region] || '—';
    html2 += `<div class="list-region-header"><span class="rh-num">.${num}</span><span class="rh-jp">${region}</span><span class="rh-rule"></span><span class="rh-count">${String(groups[region].length).padStart(2,'0')}</span></div>`;
    groups[region].forEach(({ c, i }, j) => {
      const color = CAT_COLORS[c.cat] || "#888";
      const idx = String(i + 1).padStart(3, '0');
      html2 += `<div class="festival-item" data-idx="${i}" onclick="focusCase(${i})">
        <div class="item-num">${idx}</div>
        <div>
          <div class="item-pref">${c.pref}</div>
          <div class="item-name"><span class="item-cat-strip" style="background:${color}"></span>${c.name}</div>
          <div class="item-tagline">${c.tagline}</div>
        </div>
        <div class="item-arrow">→</div>
      </div>`;
    });
  });
  list.innerHTML = html2;
}

window.focusCase = function(idx) {
  const m = markers[idx];
  if (!m) return;
  map.setView([m.case.lat, m.case.lng], 10, { animate: true });
  setTimeout(() => {
    if (window.innerWidth <= 768) {
      openMobileSheet(m.case);
    } else {
      m.marker.openPopup();
    }
  }, 350);
  setActive(idx);
  scrollListTo(idx);
};

document.querySelectorAll('#cat-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#cat-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    rebuild();
  });
});

document.querySelectorAll('#year-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#year-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeYear = btn.dataset.year;
    rebuild();
  });
});

document.querySelectorAll('#access-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#access-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeAccess = btn.dataset.access;
    rebuild();
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  searchQ = e.target.value;
  rebuild();
});

rebuild();
</script>
</body>
</html>
