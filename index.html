<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAPAN ART MAP｜日本の芸術祭を旅する</title>

  <meta name="description" content="全国81の芸術祭・アートプロジェクトから、開催中・これから行けるイベントや旅のスタイルを地図で探せるアート旅マップ。" />
  <meta property="og:title" content="JAPAN ART MAP｜日本の芸術祭を旅する" />
  <meta property="og:description" content="全国81のアートの旅先から、次に行きたい芸術祭を探そう。開催中・これから・旅のスタイルから地図で探せます。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bawb199765-bot.github.io/japan-art-map/" />
  <meta name="twitter:card" content="summary" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* paper / sumi / vermilion editorial palette */
      --bg:       #14110d;
      --bg2:      #1a1612;
      --bg3:      #221d17;
      --line:     #2a241c;
      --line2:    #3b3328;
      --text:     #f0e8d8;
      --muted:    #8a8174;
      --dim:      #5a5247;
      --accent:   #d96650;   /* 朱 vermilion */
      --accent-2: #e8c96e;   /* gold edge */

      /* category hues — single saturated set */
      --c-urban:    #d96650;
      --c-region:   #e8c96e;
      --c-micro:    #b8b06e;
      --c-area:     #7fb3a8;
      --c-air:      #b48cc6;
      --c-museum:   #d49a6e;
      --c-craft:    #c87a9a;

      --serif: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      --sans:  Helvetica, 'Helvetica Neue', Arial, sans-serif;
      --mono:  Helvetica, 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; background: #14110d; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* subtle paper-grain on dark surfaces */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255,240,210,0.012) 1px, transparent 1px);
      background-size: 3px 3px;
      mix-blend-mode: overlay;
      z-index: 9999;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: stretch;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      z-index: 1000;
      flex-shrink: 0;
      height: 50px;
    }

    .hd-back {
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-right: 1px solid var(--line);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.15s, background 0.15s, padding 0.15s;
      white-space: nowrap;
      gap: 10px;
    }
    .hd-back:hover { color: var(--text); background: var(--bg2); }
    .hd-back::before { content: '←'; font-size: 13px; transition: transform 0.15s; }
    .hd-back:hover::before { transform: translateX(-3px); }

    .hd-brand {
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-right: 1px solid var(--line);
      gap: 16px;
    }

    .hd-mark {
      width: 30px; height: 30px;
      background: var(--accent);
      color: #fff;
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 600;
      display: grid; place-items: center;
      letter-spacing: 0;
      flex-shrink: 0;
    }

    .hd-brand-text { display: flex; flex-direction: column; line-height: 1.1; }

    .hd-brand-num {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .hd-brand h1 {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      white-space: nowrap;
    }

    .hd-sub {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px;
    }

    .hd-spacer { flex: 1; }

    .hd-meta {
      display: flex;
      align-items: center;
      border-left: 1px solid var(--line);
    }

    .hd-meta-block {
      display: flex;
      flex-direction: column;
      padding: 0 22px;
      border-right: 1px solid var(--line);
      justify-content: center;
      height: 100%;
      min-width: 110px;
    }
    .hd-meta-block:last-child { border-right: none; }

    .hd-meta-k {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .hd-meta-v {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .hd-meta-v .accent { color: var(--accent); }
    .hd-meta-v .sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 4px; letter-spacing: 0.1em; }

    /* ── LAYOUT ──────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    .sidebar {
      width: 320px;
      background: var(--bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ── DESKTOP FIXED DETAIL PANEL ───────────────────────── */
    .detail-panel {
      width: 360px;
      min-width: 320px;
      background: var(--bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .detail-panel-head {
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--bg2);
    }

    .detail-panel-head-jp {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .detail-panel-head-en {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .detail-panel-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line2) transparent;
    }

    .detail-panel-content::-webkit-scrollbar { width: 4px; }
    .detail-panel-content::-webkit-scrollbar-thumb { background: var(--line2); }
    .detail-panel-content::-webkit-scrollbar-track { background: transparent; }

    .detail-empty {
      height: 100%;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      text-align: center;
      color: var(--muted);
    }

    .detail-empty-mark {
      width: 34px;
      height: 34px;
      border: 1px solid var(--accent);
      position: relative;
      margin-bottom: 18px;
      opacity: 0.75;
    }

    .detail-empty-mark::before,
    .detail-empty-mark::after {
      content: '';
      position: absolute;
      background: var(--accent);
      opacity: 0.7;
    }

    .detail-empty-mark::before {
      width: 14px;
      height: 1px;
      left: 9px;
      top: 16px;
    }

    .detail-empty-mark::after {
      width: 1px;
      height: 14px;
      left: 16px;
      top: 9px;
    }

    .detail-empty-title {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .detail-empty-sub {
      font-family: var(--sans);
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
    }

    /* Existing popup components are reused inside the fixed panel */
    .detail-panel .popup-inner { padding: 18px 18px 22px; }
    .detail-panel .popup-thumb {
      height: 180px;
      margin: -1px -1px 16px;
      width: calc(100% + 2px);
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .detail-panel .popup-name { font-size: 20px; }
    .detail-panel .popup-desc { line-height: 1.75; }
    .detail-panel .popup-btn-row {
      position: sticky;
      bottom: 0;
      padding-top: 8px;
      background: linear-gradient(to bottom, rgba(20,17,13,0), var(--bg) 28%);
    }


    /* travel-first status + dates */
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 8.5px; font-weight: 600;
      letter-spacing: 0.10em; padding: 3px 7px; border: 1px solid var(--line2);
      white-space: nowrap;
    }
    .status-badge.ongoing { color: var(--bg); background: var(--accent); border-color: var(--accent); }
    .status-badge.upcoming { color: var(--accent-2); border-color: rgba(232,201,110,.55); background: rgba(232,201,110,.08); }
    .status-badge.yearround { color: #9ed1c6; border-color: rgba(127,179,168,.55); background: rgba(127,179,168,.08); }
    .status-badge.future, .status-badge.program, .status-badge.unknown { color: var(--muted); }
    .status-badge.ended { color: var(--dim); border-color: var(--line); }
    .event-date-primary {
      font-family: var(--serif); font-size: 14px; font-weight: 600; line-height: 1.45;
      color: var(--accent-2); padding: 10px 0 11px; margin-bottom: 2px;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .event-date-note { font-family: var(--sans); font-size: 10px; color: var(--muted); margin-top: 4px; font-weight: 400; }
    .item-status {
      display: inline-block; margin-left: 7px; padding: 1px 5px;
      border: 1px solid var(--line2); font-family: var(--mono); font-size: 7.5px;
      font-weight: 600; letter-spacing: .05em; vertical-align: 1px;
    }
    .item-status.ongoing { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .item-status.upcoming { color: var(--accent-2); border-color: rgba(232,201,110,.5); }
    .item-status.yearround { color: #9ed1c6; border-color: rgba(127,179,168,.5); }
    .item-status.future, .item-status.program, .item-status.unknown { color: var(--muted); }
    .item-status.ended { color: var(--dim); border-color: var(--line); }

    /* discovery panel shown before a case is selected */
    .discover-wrap { padding: 20px 18px 26px; }
    .discover-kicker { font-family: var(--mono); font-size: 8px; font-weight: 600; letter-spacing: .22em; color: var(--accent); text-transform: uppercase; margin-bottom: 7px; }
    .discover-title { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.35; color: var(--text); margin-bottom: 7px; }
    .discover-lead { font-family: var(--sans); font-size: 11px; line-height: 1.7; color: var(--muted); margin-bottom: 18px; }
    .discover-card { border-top: 1px solid var(--line2); padding: 14px 0; cursor: pointer; transition: opacity .15s, transform .15s; }
    .discover-card:hover { opacity: .9; transform: translateX(2px); }
    .discover-img { width: 100%; height: 112px; overflow: hidden; background: var(--bg2); margin-bottom: 10px; border: 1px solid var(--line); }
    .discover-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .discover-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px; }
    .discover-pref { font-family: var(--mono); font-size: 8px; color: var(--accent); letter-spacing:.14em; }
    .discover-name { font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--text); margin-bottom: 4px; }
    .discover-tagline { font-family: var(--sans); font-size: 10.5px; line-height: 1.55; color: var(--muted); }

    .discover-howto {
      margin: 0 0 22px;
      padding: 14px 14px 13px;
      border: 1px solid var(--line2);
      border-left: 2px solid var(--accent);
      background: var(--bg2);
      font-family: var(--sans);
      font-size: 10.5px;
      line-height: 1.7;
      color: var(--text);
    }
    .detail-guide-kicker {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .20em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .detail-guide-title {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 5px;
    }
    .detail-guide-copy {
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.65;
    }
    .recommend-block {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }
    .recommend-kicker {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .20em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .recommend-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 5px;
    }
    .recommend-lead {
      font-family: var(--sans);
      font-size: 10.5px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 9px;
    }
    .discover-howto-arrows {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 7px;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.10em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .travel-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 9px 0 12px;
    }
    .travel-tag {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 4px 7px;
      border: 1px solid var(--line2);
      background: var(--bg2);
      color: var(--text);
      font-family: var(--sans);
      font-size: 9.5px;
      line-height: 1;
      white-space: nowrap;
    }
    .travel-tag::before {
      content: '#';
      color: var(--accent);
      margin-right: 2px;
      font-family: var(--mono);
    }

    @media (max-width: 768px) {
      #travel-tag-filters {
        flex-wrap: wrap !important;
        row-gap: 4px;
      }
      .travel-theme-block { padding-bottom: 10px; }
      .travel-tag { font-size: 9px; }
    }
    .discover-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-family: var(--sans); font-size: 10px; color: var(--dim); line-height: 1.6; }

    @media (min-width: 769px) and (max-width: 1180px) {
      .sidebar { width: 280px; }
      .detail-panel { width: 320px; min-width: 300px; }
      .detail-panel .popup-inner { padding: 16px; }
      .detail-panel .popup-thumb { height: 155px; }
    }

    /* ── MOBILE ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      body { overflow: hidden; height: 100vh; height: 100svh; height: var(--vh100, 100svh); }
      .layout { flex-direction: column; overflow: hidden; height: 100%; }
      .map-wrapper { order: -1; height: 72vh; min-height: 380px; flex: none; position: relative; }
      .detail-panel { display: none !important; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-top: 1px solid var(--line);
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: block;
        transition: opacity 0.18s ease;
      }
      /* When a popup is open, hide the list area entirely so the map + popup own the screen */
      body.popup-open .sidebar {
        display: none;
      }
      body.popup-open .map-wrapper {
        height: 100%;
        flex: 1;
      }
      .festival-list { flex: none !important; overflow-y: visible !important; height: auto !important; max-height: none !important; }

      /* Compact filter blocks */
      .filter-block { padding: 9px 10px; }
      .fl-label {
        margin-bottom: 6px;
        padding-bottom: 4px;
        gap: 8px;
      }
      .fl-label-jp { font-size: 10.5px; letter-spacing: 0.04em; }
      .fl-label-en { font-size: 7px; letter-spacing: 0.18em; }

      /* All chips on one row, natural width with small gap */
      .chips {
        display: flex;
        flex-wrap: nowrap;
        gap: 3px;
        width: 100%;
        justify-content: flex-start;
      }
      .chip {
        font-size: 9.5px !important;
        padding: 4px 6px !important;
        letter-spacing: 0 !important;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .chip[data-cat]:not([data-cat="all"]),
      .chip[data-status]:not([data-status="all"]),
      .chip[data-access]:not([data-access="all"]) {
        font-size: 10px !important;
        letter-spacing: 0 !important;
      }

      /* Mobile abbreviations — `.filter-block` prefix bumps specificity above the
         desktop "non-ALL = serif" rule so font-size:0 actually takes effect */
      .filter-block .chip[data-cat="都市型芸術祭型"]       { font-size: 0 !important; }
      .filter-block .chip[data-cat="都市型芸術祭型"]::before { content: "都市"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="地域型芸術祭型"]       { font-size: 0 !important; }
      .filter-block .chip[data-cat="地域型芸術祭型"]::before { content: "里山・島"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="小規模プロジェクト型"] { font-size: 0 !important; }
      .filter-block .chip[data-cat="小規模プロジェクト型"]::before { content: "小規模"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="エリアマネジメント型"] { font-size: 0 !important; }
      .filter-block .chip[data-cat="エリアマネジメント型"]::before { content: "街歩き"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="AIR・制作拠点型"]      { font-size: 0 !important; }
      .filter-block .chip[data-cat="AIR・制作拠点型"]::before { content: "制作拠点"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="ミュージアム・拠点型"] { font-size: 0 !important; }
      .filter-block .chip[data-cat="ミュージアム・拠点型"]::before { content: "美術館"; font-size: 10px; font-family: var(--serif); }
      .filter-block .chip[data-cat="産業・工芸連携型"]     { font-size: 0 !important; }
      .filter-block .chip[data-cat="産業・工芸連携型"]::before { content: "工芸"; font-size: 10px; font-family: var(--serif); }

      header { height: auto; flex-wrap: wrap; }
      .hd-brand h1 { font-size: 13px; }
      .hd-sub { font-size: 8px; }
      .hd-meta-block { padding: 10px 14px; min-width: 0; }

      /* Map meta plate: shrink further to avoid covering coastline */
      .map-meta { top: 8px; right: 8px; padding: 5px 8px; font-size: 8px; }
      .map-meta-title { font-size: 8px; margin-bottom: 3px; }
      .map-meta-row { padding: 1px 0; gap: 10px; }

      /* Legend → single row, very compact, all 7 categories fit */
      .legend {
        padding: 4px 6px;
        gap: 4px;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }
      .legend-head {
        display: none; /* hide on mobile to save space */
      }
      .legend-body {
        flex-wrap: nowrap;
        gap: 4px;
        width: 100%;
        justify-content: space-between;
      }
      .legend-item { flex-shrink: 1; gap: 2px; min-width: 0; }
      .legend-sq { width: 5px; height: 5px; }
      .legend-label { font-size: 8.5px; letter-spacing: 0; white-space: nowrap; }
      .legend-label .en { display: none; }

      /* Shorten longest legend labels on mobile to fit one row */
      .legend-item .legend-label { font-size: 0; }
      .legend-item:nth-child(1) .legend-label::before { content: "都市"; }
      .legend-item:nth-child(2) .legend-label::before { content: "里山・島"; }
      .legend-item:nth-child(3) .legend-label::before { content: "小規模"; }
      .legend-item:nth-child(4) .legend-label::before { content: "街歩き"; }
      .legend-item:nth-child(5) .legend-label::before { content: "制作拠点"; }
      .legend-item:nth-child(6) .legend-label::before { content: "美術館"; }
      .legend-item:nth-child(7) .legend-label::before { content: "工芸"; }

      #mobile-sheet {

      .popup-desc { font-size: 11px; line-height: 1.6; margin-bottom: 12px; }

      .popup-link, .popup-link-url { font-size: 9.5px !important; padding: 9px 6px !important; letter-spacing: 0.1em !important; }

      /* Map markers slightly bigger on touch for hit area */
      .map-wrapper .leaflet-marker-icon { touch-action: manipulation; }

  { pref:"愛知", name:"国際芸術祭「あいち」", tagline:"愛知の街を舞台に、世界の現代アートを巡る", region:"中部", lat:35.18, lng:136.91, slug:"aichi", cat:"都市型芸術祭型", tags:[], desc:"愛知県が3年に1度開催する国際現代芸術祭。愛知芸術文化センターのほか県内都市のまちなかを会場として広域に展開。現代美術を基軸に、パフォーミングアーツ・ラーニングなどジャンルを横断してアートの多様性を発信。次回2028年は芸術監督シャビール・フセイン・ムスタファのもと開催。", url:"https://aichitriennale.jp/index.html", nextYear:"2028", tokyoHours:2, localImg:"images/aichi-triennale.jpg", artists:["塩田千春","草間彌生","ヤノベケンジ","ウーゴ・ロンディノーネ","ムルヤナ"] },
  { pref:"三重", name:"亀山トリエンナーレ", tagline:"亀山のまちに点在する、小さな表現を訪ねる", region:"中部", lat:34.85, lng:136.45, slug:"mie", cat:"小規模プロジェクト型", tags:[], desc:"三重県亀山市が推進するアートまちづくり事業。このまちに暮らす人々の営みの中で培われ時代・世代を超えて継承される心動かすものをアートと捉え、2014年から3年に1度の芸術祭を実施。", url:"https://www.kankomie.or.jp/special/art-kameyama/#top", localImg:"images/31_kameyama.jpg", nextYear:"通年", tokyoHours:3, artists:["浅野暢晴","浅野言朗","ティモ・ライト（フィンランド）"] },

  { pref:"鳥取", name:"鳥取県立美術館の取り組み", tagline:"鳥取の新しい美術館から、街へ出かける", region:"中国・四国", lat:35.5, lng:134.24, slug:"tottori", cat:"AIR・制作拠点型", tags:[], desc:"2025年に倉吉市にオープンした鳥取県立美術館を核に、整備段階から地域との対話を重ねて進められてきた文化政策。民藝運動ゆかりの地・鳥取の風土を活かしながら、県民の学び・交流・創造活動の拠点として設計。", url:"https://tottori-moa.jp/", localImg:"images/37_tottori_moa.jpg", nextYear:"通年", tokyoHours:5.5, artists:["森村泰昌","やなぎみわ","伊藤若冲・アンディ・ウォーホル・ゲルハルト・リヒター（開館記念展）"] },
  { pref:"島根", name:"石見アーツプロジェクト", tagline:"石見で、地域に根づくアート活動を訪ねる", region:"中国・四国", lat:34.68, lng:131.98, slug:"shimane", cat:"小規模プロジェクト型", tags:[], desc:"島根県石見地域を対象にした文化芸術振興の取り組み。石見神楽・石見銀山・石州和紙といった地域固有の文化資源を現代のアート表現と接続しながら、若い世代のアーティストや文化関係者の移住・定住を促進する。", url:"https://artsiwami.localinfo.jp/", localImg:"images/38_iwami_arts.png", nextYear:"通年", tokyoHours:6, artists:["竹内大樹（発起人・舞台俳優）","加藤泉（石見美術館ゆかりの国際的作家）"] },
  { pref:"岡山", name:"岡山芸術交流", tagline:"岡山の街なかで、国際現代アートを巡る", region:"中国・四国", lat:34.66, lng:133.93, slug:"okayama", cat:"地域型芸術祭型", tags:[], desc:"岡山市の城下町エリアを主会場に、3年に1度開催される国際現代芸術展。林原美術館・旧内山下小学校など歴史的な建物や公共空間を使い、世界水準のインスタレーションを展開する。徒歩で回遊できるコンパクトな会場配置が特色。", url:"https://www.okayamaartsummit.jp/", nextYear:"2028", tokyoHours:3, artists:["リクリット・ティラヴァーニャ（2022年アーティスティックディレクター）","片山真理","ダン・グラハム","ピエール・ユイグ"] },
  { pref:"広島", name:"広島国際建築祭", tagline:"尾道・福山で、名建築と街の物語を歩く", region:"中国・四国", lat:34.4, lng:133.4, slug:"hiroshima", cat:"地域型芸術祭型", tags:[], desc:"2025年から開始された建築という専門分野に特化した広島発の国際フェスティバル。福山市・尾道市などを中心に、現代建築を巡るツアーや展示・シンポジウムを通じて都市の記憶・復興・再生を多角的に問い直す。", url:"https://hiroshima-architecture-exhibition.jp/", localImg:"images/40_hiroshima_architecture.png", nextYear:"2028", tokyoHours:4, artists:["安藤忠雄","伊東豊雄","妹島和世・西沢立衛（SANAA）","丹下健三"] },
  { pref:"山口", name:"YCAM（山口情報芸術センター）", tagline:"山口で、メディアアートの実験に触れる", region:"中国・四国", lat:34.19, lng:131.47, slug:"yamaguchi", cat:"ミュージアム・拠点型", tags:[], desc:"山口市が設置した公共のメディアアート施設。アート・テクノロジー・研究を統合したR&D機能を持ち、展覧会・パフォーマンス・市民ワークショップから国際的な共同制作まで幅広く展開。アーティストとエンジニアが共同制作する体制が国内唯一レベル。", url:"https://www.ycam.jp/", localImg:"images/41_ycam.jpg", nextYear:"通年", tokyoHours:5, artists:["坂本龍一","高谷史郎","池田亮司"] },
  { pref:"徳島", name:"神山AIR", tagline:"神山の山あいで、アーティストの制作現場へ", region:"中国・四国", lat:33.85, lng:134.22, slug:"tokushima", cat:"AIR・制作拠点型", tags:[], desc:"徳島県神山町で展開するアーティスト・イン・レジデンスプログラム。1990年代後半から始まり、滞在制作を入口にITサテライトオフィスの誘致・移住者受け入れ・空き家再生へと波及。地方創生政策に大きな影響を与えた神山モデルの原点。", url:"https://www.in-kamiyama.jp/art/", localImg:"images/42_kamiyama_air.jpg", nextYear:"通年", tokyoHours:5, artists:["金子未弥","Iede Reckman","Shirley Cho"] },
  { pref:"香川", name:"瀬戸内国際芸術祭", tagline:"瀬戸内の島々を、アートを目当てに旅する", region:"中国・四国", lat:34.33, lng:134.04, slug:"kagawa", cat:"地域型芸術祭型", tags:[], desc:"瀬戸内海の島々と港を舞台に3年に1度開催される大規模な国際芸術祭。直島・豊島・女木島・小豆島など12の島と2つの港を会場に、国内外のアーティストによる常設・期間限定作品が展開。来場者数は毎回100万人を超える。2025年に本祭を開催済みで、次回本祭は2028年。2026年は会期外プログラム「ART SETOUCHI」を実施。", url:"https://setouchi-artfest.jp/", nextYear:"2028", tokyoHours:5, localImg:"images/kagawa-setouchi.png", artists:["草間彌生","横尾忠則","クリスチャン・ボルタンスキー","内藤礼","西沢立衛","ジュリアン・オピー"] },

const TRAVEL_TAG_ORDER = ["島・海","温泉","建築","写真・映像","工芸","自然・里山","街歩き","食"];

function getTravelTags(c) {
  const text = `${c.name} ${c.tagline || ''} ${c.desc || ''} ${c.cat || ''}`;
  const tags = new Set(c.travelTags || []);

  // 島・海
  if (/(島|海|瀬戸内|宮島|種子島|やんばる|臨海|港|石巻|三陸)/.test(text)) tags.add("島・海");

  // 温泉
  if (/(温泉|道後|別府|武雄|土湯|下呂|蔵王)/.test(text)) tags.add("温泉");

  // 建築
  if (/(建築|町家|古民家|歴史的建造物|公共施設|寺院|神社|社寺|造船所跡|廃校)/.test(text) ||
      /東京建築祭|広島国際建築祭|くまもとアートポリス|YCAM/.test(c.name)) tags.add("建築");

  // 写真・映像
  if (/(写真|映像|メディアアート|メディアアーツ)/.test(text) ||
      /KYOTOGRAPHIE|浅間国際フォト|恵比寿映像祭/.test(c.name)) tags.add("写真・映像");

  // 工芸
  if (c.cat === "産業・工芸連携型" ||
      /(工芸|和紙|織物|テキスタイル|陶磁器|有田焼|ガラス|磁器|窯元)/.test(text)) tags.add("工芸");

  // 自然・里山
  if (/(里山|自然|森|山|農村|田園|北アルプス|富士山|六甲|亜熱帯|森林|公園)/.test(text) ||
      c.cat === "地域型芸術祭型") tags.add("自然・里山");

  // 街歩き
  if (/(街|まち|町並み|商店街|中心市街地|都市空間|回遊|歩く|巡る)/.test(text) ||
      c.cat === "都市型芸術祭型" || c.cat === "エリアマネジメント型") tags.add("街歩き");

  // 食
  if (/(食|地場食材|マルシェ|酒蔵|飲食|料理)/.test(text) ||
      /Reborn|房総国際芸術祭/.test(c.name)) tags.add("食");

  return TRAVEL_TAG_ORDER.filter(t => tags.has(t));
}

function travelTagsHtml(c) {
  const tags = getTravelTags(c);
  if (!tags.length) return '';
  return `<div class="travel-tags">${tags.map(t => `<span class="travel-tag">${t}</span>`).join('')}</div>`;
}

function updateDynamicFilterLabels() {
  const el = document.getElementById('upcoming-filter-label');
  if (el) el.textContent = `${todayLocal().getFullYear()}年これから`;
}

function toLocalDay(dateString) {
  if (!dateString) return null;
  const [y,m,d] = dateString.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function todayLocal() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function formatMD(dateString) {
  const d = toLocalDay(dateString);
  return d ? `${d.getMonth()+1}/${d.getDate()}` : '';
}

function formatDateRange(c) {
  if (c.dateText) return c.dateText;
  if (c.startDate && c.endDate) {
    const s = toLocalDay(c.startDate), e = toLocalDay(c.endDate);
    if (!s || !e) return c.nextYear || '日程未発表';
    if (s.getFullYear() === e.getFullYear()) {
      return `${s.getFullYear()}.${s.getMonth()+1}.${s.getDate()} — ${e.getMonth()+1}.${e.getDate()}`;
    }
    return `${s.getFullYear()}.${s.getMonth()+1}.${s.getDate()} — ${e.getFullYear()}.${e.getMonth()+1}.${e.getDate()}`;
  }
  if (c.nextYear === '通年') return '通年で楽しめる';
  if (/^20\d{2}$/.test(c.nextYear || '')) return `${c.nextYear}年 開催予定`;
  return '日程未発表';
}

function getEventStatus(c) {
  const today = todayLocal();
  if (c.yearRound || c.nextYear === '通年') return { key:'yearround', label:'通年' };
  if (c.statusMode === 'program') return { key:'program', label:c.statusLabel || '年間プログラム' };
  if (c.startDate && c.endDate) {
    const s = toLocalDay(c.startDate), e = toLocalDay(c.endDate);
    if (today < s) {
      const eventYear = s.getFullYear();
      const days = Math.ceil((s - today) / 86400000);
      if (eventYear > today.getFullYear()) return { key:'future', label:`${eventYear}予定` };
      if (c.approximateDate) return { key:'upcoming', label:`${s.getMonth()+1}月から` };
      return { key:'upcoming', label: days <= 30 ? `あと${days}日` : `${formatMD(c.startDate)}から` };
    }
    if (today <= e) return { key:'ongoing', label:'開催中' };
    return { key:'ended', label:'終了' };
  }
  const y = parseInt(c.nextYear, 10);
  if (Number.isFinite(y) && y > today.getFullYear()) return { key:'future', label:`${y}予定` };
  return { key:'unknown', label:'日程未発表' };
}

function getFiltered() {
  const currentYear = todayLocal().getFullYear();
  return CASES.filter(c => {
    if (activeCat !== "all" && c.cat !== activeCat) return false;

    if (activeStatus !== "all") {
      const st = getEventStatus(c);
      if (activeStatus === 'ongoing' && st.key !== 'ongoing') return false;
      if (activeStatus === 'yearround' && st.key !== 'yearround') return false;
      if (activeStatus === 'upcoming') {
        const s = c.startDate ? toLocalDay(c.startDate) : null;
        if (st.key !== 'upcoming' || !s || s.getFullYear() !== currentYear) return false;
      }
      if (activeStatus === 'future') {
        const y = c.startDate ? toLocalDay(c.startDate).getFullYear() : parseInt(c.nextYear, 10);
        if (!(Number.isFinite(y) && y > currentYear)) return false;
      }
    }

    if (activeTravelTag !== "all" && !getTravelTags(c).includes(activeTravelTag)) return false;

    if (activeAccess !== "all") {
      const h = c.tokyoHours;
      if (activeAccess === "daytrip" && h > 2) return false;
      if (activeAccess === "overnight" && (h <= 2 || h > 4)) return false;
      if (activeAccess === "longtrip" && h <= 4) return false;
    }

    if (searchQ) {
      const q = searchQ.toLowerCase();
      const travelTagText = getTravelTags(c).join(' ').toLowerCase();
      if (!c.name.toLowerCase().includes(q) && !c.pref.includes(q) && !c.tagline.includes(q) && !travelTagText.includes(q)) return false;
    }
    return true;
  });
}

// MAP — Stamen Toner Lite gives a clean editorial canvas; falls back gracefully.
const map = L.map('map', { center: [37.0, 137.5], zoom: 6, zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19,
  pane: 'shadowPane',
  opacity: 0.85
}).addTo(map);

let markers = [];

function markerIcon(c, active) {
  const color = CAT_COLORS[c.cat] || "#888";
  const s = active ? 26 : 18;
  const inner = active ? 10 : 6;
  const ring = active ? `box-shadow:0 0 0 1px #fff, 0 0 0 4px ${color}66, 0 4px 14px rgba(0,0,0,0.4);` : `box-shadow:0 0 0 1px rgba(255,255,255,0.85), 0 2px 8px rgba(0,0,0,0.35);`;
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:${s}px;height:${s}px;">
      <div style="position:absolute;inset:0;border-radius:50%;background:${color};${ring}transition:all 0.18s ease;"></div>
      <div style="position:absolute;top:50%;left:50%;width:${inner}px;height:${inner}px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);"></div>
      <div style="position:absolute;inset:-8px;cursor:pointer"></div>
    </div>`,
    iconSize: [s, s],
    iconAnchor: [s/2, s/2],
    popupAnchor: [0, -(s/2+6)]
  });
}

function popupHtml(c) {
  const color = CAT_COLORS[c.cat] || "#888";
  const tripType = c.tokyoHours <= 2 ? '日帰り向き' : c.tokyoHours <= 4 ? '1泊向き' : '遠征向き';
  const accessLabel = c.tokyoHours === 0 ? `都内・${tripType}` : `約 ${c.tokyoHours}h・${tripType}`;
  const status = getEventStatus(c);
  const dateLabel = formatDateRange(c);
  const thumbSrc = c.localImg || '';
  const hasImg = thumbSrc.length > 0;
  const hasArtists = c.artists && c.artists.length > 0;
  return `<div class="popup-inner">
    ${hasImg ? `<div class="popup-thumb"><img src="${thumbSrc}" alt="${c.name}" onerror="this.parentElement.style.display='none'" /></div>` : ''}
    <div class="popup-pref-row">${c.pref}<span class="status-badge ${status.key}">${status.label}</span></div>
    <div class="popup-name">${c.name}</div>
    <div class="popup-tagline">${c.tagline}</div>
    ${travelTagsHtml(c)}
    <div class="event-date-primary">${dateLabel}${c.dateNote ? `<div class="event-date-note">${c.dateNote}</div>` : ''}</div>
    <div class="popup-meta">
      <div class="popup-meta-item"><span class="popup-meta-k">旅の目安</span><span class="popup-meta-v">${tripType}</span></div>
      <div class="popup-meta-item"><span class="popup-meta-k">東京から</span><span class="popup-meta-v">${accessLabel}</span></div>
    </div>
    <div class="popup-desc">${c.desc}</div>
    ${hasArtists ? `<div class="popup-artists"><div class="popup-artists-k">見られるアーティスト</div><div class="popup-artists-v">${c.artists.join(' / ')}</div></div>` : ''}
    <div class="popup-head">
      <div class="popup-cat-sq" style="background:${color}"></div>
      <div class="popup-region"><span class="accent-mark">${catLabel(c.cat)}</span></div>
    </div>
    <div class="popup-btn-row">
      ${c.slug ? `<a class="popup-link" href="https://bawb199765-bot.github.io/Art_PlaceMaking/detail-${c.slug}.html" target="_blank" rel="noopener">詳しく見る →</a>` : ''}
      ${c.url ? `<a class="popup-link-url" href="${c.url}" target="_blank" rel="noopener">公式サイト</a>` : ''}
    </div>
  </div>`;
}


let selectedCaseName = null;
const detailPanelContent = document.getElementById('detail-panel-content');
const detailPanelTitle = document.getElementById('detail-panel-title');
const detailPanelTitleEn = document.getElementById('detail-panel-title-en');

function getDiscoveryPicks(candidates = CASES) {
  const today = todayLocal();
  const withImages = candidates.filter(c => c.localImg);

  const ongoing = withImages
    .filter(c => getEventStatus(c).key === 'ongoing')
    .sort((a,b) => {
      const ae = a.endDate ? toLocalDay(a.endDate) : new Date(2999,0,1);
      const be = b.endDate ? toLocalDay(b.endDate) : new Date(2999,0,1);
      return ae - be;
    });

  const upcoming = withImages
    .filter(c => {
      const st = getEventStatus(c);
      const s = c.startDate ? toLocalDay(c.startDate) : null;
      return st.key === 'upcoming' && s && s.getFullYear() === today.getFullYear();
    })
    .sort((a,b) => toLocalDay(a.startDate) - toLocalDay(b.startDate));

  const yearround = withImages
    .filter(c => getEventStatus(c).key === 'yearround')
    .sort((a,b) => a.name.localeCompare(b.name, 'ja'));

  return [...ongoing, ...upcoming, ...yearround].slice(0, 3);
}

function renderDiscoveryPanel(candidates = CASES) {
  if (!detailPanelContent || window.innerWidth <= 768) return;
  selectedCaseName = null;
  if (detailPanelTitle) detailPanelTitle.textContent = '芸術祭の詳細';
  if (detailPanelTitleEn) detailPanelTitleEn.textContent = 'Festival Detail';
  const picks = getDiscoveryPicks(candidates);
  const cards = picks.map(c => {
    const st = getEventStatus(c);
    const img = c.localImg ? `<div class="discover-img"><img src="${c.localImg}" alt="${c.name}" onerror="this.parentElement.style.display='none'"></div>` : '';
    return `<div class="discover-card" onclick="focusNamedCase('${c.name.replace(/'/g,"\\'")}')">
      ${img}
      <div class="discover-meta"><span class="discover-pref">${c.pref}</span><span class="status-badge ${st.key}">${st.label}</span></div>
      <div class="discover-name">${c.name}</div>
      <div class="discover-tagline">${c.tagline}</div>
    </div>`;
  }).join('');
  const currentYear = todayLocal().getFullYear();
  detailPanelContent.innerHTML = `<div class="discover-wrap">
    <div class="discover-howto">
      <div class="detail-guide-kicker">DETAIL VIEW</div>
      <div class="detail-guide-title">ここに、選んだ芸術祭の詳細が表示されます。</div>
      <div class="detail-guide-copy">左の一覧、または右の地図から気になる芸術祭を選んでください。画像・会期・旅の目安・見どころを、この中央パネルで確認できます。</div>
      <div class="discover-howto-arrows"><span>← 一覧から選ぶ</span><span>地図から選ぶ →</span></div>
    </div>

    <div class="recommend-block">
      <div class="recommend-kicker">ART TRIP PICKS · ${currentYear}</div>
      <div class="recommend-title">今年行ける、おすすめの芸術祭</div>
      <div class="recommend-lead">開催中、${currentYear}年にこれから始まるもの、通年で楽しめるものから3件をピックアップ。</div>
      ${cards || '<div class="detail-empty-sub">現在、日程が確定しているおすすめを準備中です。</div>'}
      <div class="discover-foot">「開催中」「${currentYear}年これから」「旅のテーマ」「旅のスタイル」で絞り込むと、候補をもっと探せます。</div>
    </div>
  </div>`;
  detailPanelContent.scrollTop = 0;
}

function clearDesktopDetail(candidates = CASES) {
  renderDiscoveryPanel(candidates);
}

function openDesktopDetail(c) {
  if (!detailPanelContent || window.innerWidth <= 768) return;
  selectedCaseName = c.name;
  if (detailPanelTitle) detailPanelTitle.textContent = '選択中の芸術祭';
  if (detailPanelTitleEn) detailPanelTitleEn.textContent = 'Selected';
  detailPanelContent.innerHTML = popupHtml(c);
  detailPanelContent.scrollTop = 0;
}

window.focusNamedCase = function(name) {
  const idx = markers.findIndex(m => m.case.name === name);
  if (idx >= 0) window.focusCase(idx);
};

function rebuild() {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];
  const filtered = getFiltered();

  filtered.forEach((c, i) => {
    const marker = L.marker([c.lat, c.lng], { icon: markerIcon(c, false) }).addTo(map);
    marker.on('click', () => {
      setActive(i);
      scrollListTo(i);
      if (window.innerWidth <= 768) {
        openMobileSheet(c);
      } else {
        openDesktopDetail(c);
      }
    });
    markers.push({ marker, case: c, idx: i });
  });
  renderList(filtered);

  // Keep the desktop detail panel stable across filter/search rebuilds when possible.
  if (window.innerWidth > 768 && selectedCaseName) {
    const selectedIdx = filtered.findIndex(c => c.name === selectedCaseName);
    if (selectedIdx >= 0) {
      openDesktopDetail(filtered[selectedIdx]);
      setActive(selectedIdx);
      scrollListTo(selectedIdx);
    } else {
      selectedCaseName = null;
      clearDesktopDetail(filtered);
    }
  } else if (window.innerWidth > 768) {
    renderDiscoveryPanel(filtered);
  }
}

// ── Standalone mobile bottom sheet (lives directly under <body>, unaffected by Leaflet's transformed panes) ──
const mobileSheet = document.getElementById('mobile-sheet');

function openMobileSheet(c) {
  mobileSheet.innerHTML = popupHtml(c) + '<div class="sheet-close" onclick="closeMobileSheet()">✕</div>';
  mobileSheet.classList.add('open');
  document.body.classList.add('popup-open');
  setTimeout(() => {
    map.invalidateSize();
    const sheetH = mobileSheet.offsetHeight || Math.round(window.innerHeight * 0.45);
    const mapH = map.getSize().y;
    const visibleH = Math.max(mapH - sheetH, 120);
    const targetY = visibleH / 2;
    const pt = map.latLngToContainerPoint([c.lat, c.lng]);
    map.panBy([0, Math.round(pt.y - targetY)], { animate: true, duration: 0.25 });
  }, 80);
}

function closeMobileSheet() {
  mobileSheet.classList.remove('open');
  document.body.classList.remove('popup-open');
  setTimeout(() => map.invalidateSize(), 60);
}
window.closeMobileSheet = closeMobileSheet;

function setActive(idx) {
  markers.forEach((m, i) => m.marker.setIcon(markerIcon(m.case, i === idx)));
}

function scrollListTo(idx) {
  document.querySelectorAll('.festival-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.festival-item[data-idx="${idx}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

function renderList(filtered) {
  const list = document.getElementById('festival-list');
  // header counters
  const showEl = document.getElementById('hd-showing'); if (showEl) showEl.textContent = String(filtered.length).padStart(3,'0');
  const totalEl = document.getElementById('hd-total');  if (totalEl) totalEl.textContent = String(CASES.length);
  const mapShow = document.getElementById('map-showing'); if (mapShow) mapShow.textContent = filtered.length + ' / ' + CASES.length + ' 件';

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">該当する取り組みがありません<span class="es-en">No results</span></div>';
    return;
  }
  const groups = {};
  REGION_ORDER.forEach(r => { groups[r] = []; });
  filtered.forEach((c, i) => { if (groups[c.region]) groups[c.region].push({ c, i }); });
  let html2 = '';
  REGION_ORDER.forEach(region => {
    if (!groups[region].length) return;
    const num = REGION_NUM[region] || '—';
    html2 += `<div class="list-region-header"><span class="rh-num">.${num}</span><span class="rh-jp">${region}</span><span class="rh-rule"></span><span class="rh-count">${String(groups[region].length).padStart(2,'0')}</span></div>`;
    groups[region].forEach(({ c, i }, j) => {
      const color = CAT_COLORS[c.cat] || "#888";
      const idx = String(i + 1).padStart(3, '0');
      const st = getEventStatus(c);
      const showStatus = st.key !== 'ended' || activeStatus === 'all';
      html2 += `<div class="festival-item" data-idx="${i}" onclick="focusCase(${i})">
        <div class="item-num">${idx}</div>
        <div>
          <div class="item-pref">${c.pref}${showStatus ? `<span class="item-status ${st.key}">${st.label}</span>` : ''}</div>
          <div class="item-name"><span class="item-cat-strip" style="background:${color}"></span>${c.name}</div>
          <div class="item-tagline">${c.tagline}</div>
        </div>
        <div class="item-arrow">→</div>
      </div>`;
    });
  });
  list.innerHTML = html2;
}

window.focusCase = function(idx) {
  const m = markers[idx];
  if (!m) return;

  if (window.innerWidth <= 768) {
    map.setView([m.case.lat, m.case.lng], 10, { animate: true });
    setTimeout(() => openMobileSheet(m.case), 350);
  } else {
    // Desktop: keep list + fixed detail visible and move only the map.
    openDesktopDetail(m.case);
    map.setView([m.case.lat, m.case.lng], 9, { animate: true });
  }

  setActive(idx);
  scrollListTo(idx);
};

document.querySelectorAll('#cat-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#cat-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    selectedCaseName = null;
    rebuild();
  });
});

document.querySelectorAll('#status-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#status-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeStatus = btn.dataset.status;
    selectedCaseName = null;
    rebuild();
  });
});

document.querySelectorAll('#travel-tag-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#travel-tag-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTravelTag = btn.dataset.travelTag;
    rebuild();
  });
});

document.querySelectorAll('#access-filters .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#access-filters .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeAccess = btn.dataset.access;
    selectedCaseName = null;
    rebuild();
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  searchQ = e.target.value;
  selectedCaseName = null;
  rebuild();
});

updateDynamicFilterLabels();
rebuild();

// 会期ステータスは訪問者の端末のローカル日付で判定。
// ページを開いたまま日付をまたいでも、次の深夜に自動再判定する。
function scheduleDateRolloverRefresh() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2);
  const delay = Math.max(next - now, 1000);
  setTimeout(() => {
    updateDynamicFilterLabels();
    rebuild();
    scheduleDateRolloverRefresh();
  }, delay);
}
scheduleDateRolloverRefresh();
</script>
</body>
</html>
